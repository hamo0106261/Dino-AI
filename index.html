<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dino AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            overflow: hidden;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #eeeeee;
            background: #ffffff;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            background: #f2f2f2;
        }

        .icon-button svg {
            width: 21px;
            height: 21px;
        }

        .chat-box {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .welcome {
            width: 100%;
            max-width: 600px;
            margin: auto;
            text-align: center;
            padding: 30px;
        }

        .welcome h1 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 600;
            color: #202124;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.9;
        }

        .message {
            max-width: 82%;
            margin: 10px 0;
            padding: 9px 0;
            line-height: 1.85;
            font-size: 15.5px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            margin-left: auto;
            margin-right: 0;
            padding: 11px 15px;
            background: #f1f1f1;
            color: #202124;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
        }

        .message.bot {
            margin-right: auto;
            margin-left: 0;
            padding: 8px 0;
            background: transparent !important;
            color: #202124;
            border: none !important;
            border-radius: 0;
            box-shadow: none !important;
        }

        .message.bot a {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            padding: 7px 11px;
            border-radius: 9px;
            background: #f1f5ff;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .input-area {
            width: 100%;
            padding: 8px 15px 16px;
            background: #ffffff;
        }

        .input-box {
            width: 100%;
            max-width: 900px;
            min-height: 56px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 28px;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .user-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #202124;
            padding: 10px 7px;
            font-size: 16px;
        }

        .user-input::placeholder {
            color: #8b8f94;
        }

        .small-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #555b61;
        }

        .small-button:hover {
            background: #f3f3f3;
        }

        .small-button svg {
            width: 21px;
            height: 21px;
        }

        .send-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #202124;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .send-button:hover {
            background: #000000;
        }

        .send-button:disabled {
            opacity: 0.45;
        }

        .recording {
            background: #dc2626 !important;
            color: #ffffff !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.08);
            }
        }

        .preview,
        .audio-preview {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 8px;
            display: none;
        }

        .preview img {
            max-width: 180px;
            max-height: 150px;
            border-radius: 12px;
        }

        .audio-preview audio {
            width: 100%;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 310px;
            height: 100vh;
            padding: 18px;
            background: #ffffff;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.12);
            z-index: 100;
            transition: right 0.25s ease;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 19px;
        }

        .sidebar-item {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 13px 15px;
            margin-bottom: 8px;
            background: #f5f5f5;
            color: #202124;
            text-align: right;
            font-size: 15px;
        }

        .sidebar-item:hover {
            background: #eaeaea;
        }

        .panel {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
        }

        .panel.active {
            display: flex;
        }

        .panel-content {
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 22px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }

        .voice-call-panel {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #202124;
        }

        .voice-call-panel.active {
            display: flex;
        }

        .voice-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .voice-title {
            font-size: 25px;
            font-weight: 600;
        }

        .voice-status {
            margin-top: 10px;
            color: #6b7280;
            text-align: center;
        }

        .voice-controls {
            display: flex;
            gap: 18px;
            margin-top: 40px;
        }

        .voice-control {
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .voice-mic {
            background: #202124;
            color: #ffffff;
        }

        .voice-end {
            background: #eeeeee;
            color: #202124;
        }

        .voice-transcript {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            color: #6b7280;
            line-height: 1.8;
        }

        .copyright {
            width: 100%;
            text-align: center;
            padding: 4px 10px 8px;
            font-size: 11px;
            color: #9ca3af;
            background: #ffffff;
            flex-shrink: 0;
        }

        body.dark-mode {
            background: #0b1118;
            color: #f5f7fa;
        }

        body.dark-mode .header {
            background: #101720;
            border-color: #26313e;
        }

        body.dark-mode .header-title {
            color: #f5f7fa;
        }

        body.dark-mode .icon-button {
            color: #f5f7fa;
        }

        body.dark-mode .icon-button:hover,
        body.dark-mode .small-button:hover {
            background: #1d2732;
        }

        body.dark-mode .welcome h1 {
            color: #f5f7fa;
        }

        body.dark-mode .welcome p {
            color: #9ca3af;
        }

        body.dark-mode .message.bot {
            background: transparent !important;
            color: #f5f7fa !important;
        }

        body.dark-mode .message.user {
            background: #202a35;
            color: #f5f7fa;
        }

        body.dark-mode .message.bot a {
            background: #182538;
            color: #78a9ff;
        }

        body.dark-mode .input-area {
            background: #101720;
        }

        body.dark-mode .input-box {
            background: #151e28;
            border-color: #33404d;
        }

        body.dark-mode .user-input {
            color: #f5f7fa;
        }

        body.dark-mode .small-button {
            color: #d1d5db;
        }

        body.dark-mode .send-button {
            background: #f5f7fa;
            color: #111827;
        }

        body.dark-mode .sidebar {
            background: #101720;
            color: white;
        }

        body.dark-mode .sidebar-item {
            background: #1b2632;
            color: white;
        }

        body.dark-mode .panel-content {
            background: #111a23;
            color: white;
        }

        body.dark-mode textarea {
            background: #151e28;
            color: white;
            border-color: #33404d;
        }

        body.dark-mode .voice-call-panel {
            background: #0b1118;
            color: white;
        }

        body.dark-mode .voice-avatar {
            background: #18222d;
        }

        body.dark-mode .voice-status,
        body.dark-mode .voice-transcript {
            color: #9ca3af;
        }

        body.dark-mode .voice-mic {
            background: #f5f7fa;
            color: #111827;
        }

        body.dark-mode .voice-end {
            background: #202b37;
            color: white;
        }

        body.dark-mode .copyright {
            background: #101720;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            html,
            body {
                width: 100%;
                height: 100%;
                max-width: 100%;
                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
            }

            .header {
                width: 100%;
                height: 56px;
                min-height: 56px;
                padding: 0 6px;
                flex-shrink: 0;
            }

            .header-title {
                font-size: 18px;
            }

            .header-buttons {
                gap: 0;
            }

            .icon-button {
                width: 42px;
                height: 42px;
                flex-shrink: 0;
            }

            .icon-button svg {
                width: 22px;
                height: 22px;
            }

            .chat-box {
                width: 100%;
                max-width: none;
                flex: 1 1 auto;
                min-height: 0;
                height: auto;
                margin: 0;
                padding: 14px 10px;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .welcome {
                width: 100%;
                max-width: none;
                padding: 20px 8px;
                margin: auto;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .welcome p {
                font-size: 15px;
                line-height: 1.8;
            }

            .message {
                max-width: 94%;
                font-size: 15px;
                line-height: 1.75;
                margin: 8px 0;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .message.user {
                max-width: 88%;
                padding: 10px 13px;
            }

            .message.bot {
                max-width: 94%;
                padding: 7px 0;
            }

            .message.bot a {
                max-width: 100%;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .input-area {
                width: 100%;
                flex: 0 0 auto;
                padding: 6px 6px 5px;
            }

            .input-box {
                width: 100%;
                max-width: none;
                min-height: 52px;
                padding: 5px;
                gap: 2px;
                border-radius: 27px;
            }

            .small-button {
                width: 40px;
                height: 40px;
                min-width: 40px;
                flex-shrink: 0;
            }

            .small-button svg {
                width: 21px;
                height: 21px;
            }

            .user-input {
                width: 100%;
                min-width: 0;
                padding: 9px 4px;
                font-size: 15px;
            }

            .send-button {
                width: 40px;
                height: 40px;
                min-width: 40px;
                flex-shrink: 0;
            }

            .sidebar {
                width: min(290px, 85vw);
                height: 100dvh;
                padding: 16px 12px;
                overflow-y: auto;
            }

            .sidebar-header {
                font-size: 19px;
                margin-bottom: 20px;
            }

            .sidebar-item {
                min-height: 48px;
                padding: 13px 14px;
                margin-bottom: 8px;
                font-size: 15px;
            }

            .panel {
                width: 100%;
                height: 100dvh;
                padding: 8px;
                overflow: hidden;
            }

            .panel-content {
                width: 100%;
                max-width: none;
                max-height: 90dvh;
                padding: 16px;
                border-radius: 15px;
                overflow-y: auto;
            }

            .panel-header {
                font-size: 18px;
            }

            textarea {
                min-height: 120px;
                font-size: 15px;
            }

            .voice-call-panel {
                width: 100%;
                height: 100dvh;
                padding: 18px;
                overflow: hidden;
            }

            .voice-avatar {
                width: 85px;
                height: 85px;
                font-size: 30px;
                margin-bottom: 16px;
            }

            .voice-title {
                font-size: 23px;
            }

            .voice-status {
                max-width: 90%;
                font-size: 15px;
                line-height: 1.7;
            }

            .voice-controls {
                gap: 18px;
                margin-top: 30px;
            }

            .voice-control {
                width: 58px;
                height: 58px;
                font-size: 20px;
            }

            .voice-transcript {
                left: 10px;
                right: 10px;
                bottom: 15px;
                max-width: 94%;
                font-size: 14px;
                line-height: 1.7;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .preview,
            .audio-preview {
                width: 100%;
                max-width: none;
                margin: 0 auto 6px;
            }

            .preview img {
                max-width: 130px;
                max-height: 110px;
            }

            .copyright {
                width: 100%;
                padding: 4px 6px 5px;
                font-size: 9px;
                line-height: 1.4;
                flex-shrink: 0;
                white-space: normal;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <button id="menuButton" class="icon-button" title="القائمة">
            <svg viewBox="0 0 24 24">
                <path
                    d="M4 7h16M4 12h16M4 17h16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">
                </path>
            </svg>
        </button>

        <div class="header-title">
            Dino AI
        </div>

        <div class="header-buttons">

            <button
                id="voiceCallButton"
                class="icon-button"
                title="محادثة صوتية">

                <svg viewBox="0 0 24 24">
                    <path
                        d="M7 4h3l2 5-2 2a14 14 0 0 0 3 3l2-2 5 2v3c0 1-1 2-2 2C11 19 5 13 5 6c0-1 1-2 2-2z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linejoin="round">
                    </path>
                </svg>

            </button>

        </div>

    </header>

    <main id="chatBox" class="chat-box">

        <div id="welcomeMessage" class="welcome">

            <h1>Dino AI</h1>

            <p>
                أهلاً بك 👋
                <br>
                أنا Dino AI، اسألني عن أي شيء.
            </p>

        </div>

    </main>

    <div class="input-area">

        <div id="imagePreview" class="preview"></div>

        <div id="audioPreview" class="audio-preview"></div>

        <div class="input-box">

            <button
                id="attachButton"
                class="small-button"
                title="إرفاق">

                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 5v14M5 12h14"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round">
                    </path>
                </svg>

            </button>

            <input
                id="imageInput"
                type="file"
                accept="image/*"
                style="display:none;">

            <button
                id="audioButton"
                class="small-button"
                title="تسجيل صوت">

                <svg viewBox="0 0 24 24">
                    <rect
                        x="8"
                        y="3"
                        width="8"
                        height="12"
                        rx="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">
                    </rect>

                    <path
                        d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round">
                    </path>
                </svg>

            </button>

            <input
                id="userInput"
                class="user-input"
                type="text"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off">

            <button
                id="sendButton"
                class="send-button"
                title="إرسال">

                ↑

            </button>

        </div>

    </div>

    <footer class="copyright">
        © 2026 Dino AI — جميع الحقوق محفوظة لـ Mohamed Rade
    </footer>

</div>

<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">

        <strong>Dino AI</strong>

        <button id="closeSidebar" class="icon-button">
            ✕
        </button>

    </div>

    <button id="newChatButton" class="sidebar-item">
        ➕ محادثة جديدة
    </button>

    <button id="memoryButton" class="sidebar-item">
        🧠 الذاكرة
    </button>

    <button id="chatsButton" class="sidebar-item">
        💬 المحادثات
    </button>

    <button id="settingsButton" class="sidebar-item">
        ⚙️ الإعدادات
    </button>

</aside>

<div id="memoryPanel" class="panel">

    <div class="panel-content">

        <div class="panel-header">

            <strong>🧠 الذاكرة</strong>

            <button id="closeMemory" class="icon-button">
                ✕
            </button>

        </div>

        <textarea
            id="memoryInput"
            placeholder="اكتب شيئاً تريد أن يتذكره Dino AI..."></textarea>

        <button
            id="saveMemoryButton"
            class="sidebar-item">
            حفظ
        </button>

        <div id="memoryList"></div>

    </div>

</div>

<div id="chatsPanel" class="panel">

    <div class="panel-content">

        <div class="panel-header">

            <strong>💬 المحادثات</strong>

            <button id="closeChats" class="icon-button">
                ✕
            </button>

        </div>

        <div id="chatsList"></div>

    </div>

</div>

<div id="settingsPanel" class="panel">

    <div class="panel-content">

        <div class="panel-header">

            <strong>⚙️ الإعدادات</strong>

            <button id="closeSettings" class="icon-button">
                ✕
            </button>

        </div>

        <button
            id="darkModeButton"
            class="sidebar-item">
            🌙 الوضع الداكن
        </button>

        <button
            id="deleteMemoryButton"
            class="sidebar-item">
            🗑️ حذف الذاكرة
        </button>

        <button
            id="deleteChatsButton"
            class="sidebar-item">
            🗑️ حذف المحادثات
        </button>

    </div>

</div>

<div id="voiceCallPanel" class="voice-call-panel">

    <div class="voice-avatar">
        AI
    </div>

    <div class="voice-title">
        Dino AI
    </div>

    <div id="voiceStatus" class="voice-status">
        اضغط على الميكروفون وابدأ الكلام
    </div>

    <div class="voice-controls">

        <button
            id="voiceMicButton"
            class="voice-control voice-mic"
            title="ابدأ الكلام">

            <svg viewBox="0 0 24 24" width="23" height="23">

                <rect
                    x="8"
                    y="3"
                    width="8"
                    height="12"
                    rx="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">
                </rect>

                <path
                    d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">
                </path>

            </svg>

        </button>

        <button
            id="endVoiceCallButton"
            class="voice-control voice-end"
            title="إنهاء المكالمة">

            ✕

        </button>

    </div>

    <div
        id="voiceTranscript"
        class="voice-transcript">
    </div>

</div>

<script>

const API_URL =
    "https://dino-ai-api.mmaojmmmoh.workers.dev";


const chatBox =
    document.getElementById("chatBox");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const audioButton =
    document.getElementById("audioButton");

const attachButton =
    document.getElementById("attachButton");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const audioPreview =
    document.getElementById("audioPreview");

const sidebar =

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.innerText =
        text;

    chatBox.appendChild(message);

    chatBox.scrollTop =
        chatBox.scrollHeight;

    return message;
}


function displayBotReply(text) {

    const message =
        document.createElement("div");

    message.className =
        "message bot";

    const urlRegex =
        /(https?:\/\/[^\s]+)/g;

    const parts =
        String(text).split(urlRegex);

    for (let i = 0; i < parts.length; i++) {

        const part = parts[i];

        if (/^https?:\/\//.test(part)) {

            const link =
                document.createElement("a");

            link.href =
                part;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.innerText =
                "🔗 فتح الرابط";

            message.appendChild(link);

        } else if (part) {

            message.appendChild(
                document.createTextNode(part)
            );

        }
    }

    chatBox.appendChild(message);

    chatBox.scrollTop =
        chatBox.scrollHeight;

    return message;
}


function playAudio(base64) {

    try {

        if (!base64) {
            return null;
        }

        const audio =
            new Audio(
                "data:audio/mpeg;base64," +
                base64
            );

        audio.volume = 1;

        audio.play().catch(error => {

            console.log(
                "تعذر تشغيل الصوت تلقائياً:",
                error
            );

        });

        currentVoiceAudio =
            audio;

        return audio;

    } catch (error) {

        console.error(error);

        return null;
    }
}


function getOwnerAnswer(message) {

    const text =
        message
            .toLowerCase()
            .replace(/[؟?!.,،]/g, "")
            .trim();

    const creatorQuestions = [
        "مين صانعك",
        "من صانعك",
        "مين صنعك",
        "من صنعك",
        "مين مطورك",
        "من مطورك",
        "مين عملك",
        "من عملك",
        "مين اللي صنعك",
        "من الذي صنعك"
    ];

    const copyrightQuestions = [
        "مين مالك حقوق الطبع والنشر ليك",
        "مين مالك حقوق النشر",
        "من مالك حقوق النشر",
        "مين صاحب حقوق النشر",
        "من صاحب حقوق النشر",
        "مين مالك حقوقك",
        "من يملك حقوقك",
        "مين مالك التطبيق",
        "من مالك التطبيق"
    ];

    for (const question of creatorQuestions) {

        if (text.includes(question)) {

            return "أنا Dino AI، تم تصميمي وتطويري بواسطة Mohamed Rade.";

        }
    }

    for (const question of copyrightQuestions) {

        if (text.includes(question)) {

            return "حقوق تطبيق Dino AI ومحتواه وتصميمه محفوظة لمالكه ومطوّره Mohamed Rade، مع مراعاة حقوق وتراخيص أي تقنيات أو خدمات خارجية مستخدمة داخل التطبيق.";

        }
    }

    return null;
}


async function sendMessage() {

    let message =
        userInput.value.trim();

    if (!message && !selectedAudio) {
        return;
    }

    if (selectedImage) {

        message +=
            (
                message
                    ? "\n\n"
                    : ""
            ) +
            "🖼️ صورة مرفقة: " +
            selectedImage.name;
    }

    if (message) {

        addMessage(
            message,
            "user"
        );
    }

    userInput.value = "";

    sendButton.disabled = true;

    const loading =
        addMessage(
            "Dino AI يكتب...",
            "bot"
        );

    try {

        const ownerAnswer =
            getOwnerAnswer(message);

        if (ownerAnswer) {

            loading.remove();

            displayBotReply(
                ownerAnswer
            );

            loadingComplete();

            return;
        }

        let response;

        if (selectedAudio) {

            const formData =
                new FormData();

            formData.append(
                "message",
                message
            );

            formData.append(
                "audio",
                selectedAudio,
                "voice.webm"
            );

            response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );

        } else {

            response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    message
                            })
                    }
                );
        }

        const data =
            await response.json();

        loading.remove();

        if (data.error) {

            displayBotReply(
                "⚠️ " + data.error
            );

        } else {

            const reply =
                data.reply ||
                "لم يصل رد.";

            displayBotReply(reply);

            if (data.audio) {

                playAudio(
                    data.audio
                );
            }
        }

    } catch (error) {

        console.error(error);

        loading.remove();

        displayBotReply(
            "⚠️ حصل خطأ في الاتصال بـ Dino AI."
        );

    } finally {

        loadingComplete();
    }
}


function loadingComplete() {

    selectedAudio = null;
    selectedImage = null;

    imagePreview.innerHTML = "";
    imagePreview.style.display = "none";

    audioPreview.innerHTML = "";
    audioPreview.style.display = "none";

    sendButton.disabled = false;
}


audioButton.onclick =
    async function() {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {

            mediaRecorder.stop();

            return;
        }

        try {

            microphoneStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(
                    microphoneStream
                );

            mediaRecorder.ondataavailable =
                function(event) {

                    if (event.data.size > 0) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };

            mediaRecorder.onstop =
                function() {

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    "audio/webm"
                            }
                        );

                    selectedAudio =
                        blob;

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    audioPreview.innerHTML =
                        `<audio controls src="${url}"></audio>`;

                    audioPreview.style.display =
                        "block";

                    if (microphoneStream) {

                        microphoneStream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );
                    }

                    audioButton.classList.remove(
                        "recording"
                    );

                    sendMessage();
                };

            mediaRecorder.start();

            audioButton.classList.add(
                "recording"
            );

        } catch (error) {

            console.error(error);

            alert(
                "اسمح للمتصفح باستخدام الميكروفون."
            );
        }
    };

function getMemory() {

        localStorage.getItem(
            "dinoMemory"
        ) || "[]"

function renderMemory() {

    const memory =
        getMemory();

    memoryList.innerHTML =
        "";

    if (memory.length === 0) {

        memoryList.innerText =
            "لا توجد ذكريات محفوظة.";

        return;
    }

    memory.forEach(
        function(item, index) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "sidebar-item";

            div.innerText =
                item;

            div.onclick =
                function() {

                    memory.splice(
                        index,
                        1
                    );

                    localStorage.setItem(
                        "dinoMemory",
                        JSON.stringify(memory)
                    );

                    renderMemory();

                };

            memoryList.appendChild(
                div
            );

        }
    );
}

function saveCurrentChat() {

    const messages =
        Array.from(
            chatBox.querySelectorAll(
                ".message"
            )
        );

    if (messages.length === 0) {
        return;
    }

    const chats =
        JSON.parse(
            localStorage.getItem(
                "dinoChats"
            ) || "[]"
        );

    const content =
        messages.map(
            message =>
                message.innerText
        );

    chats.unshift({
        date:
            new Date().toLocaleString(
                "ar-EG"
            ),
        messages:
            content
    });

    localStorage.setItem(
        "dinoChats",
        JSON.stringify(
            chats.slice(0, 20)
        )
    );
}


function renderChats() {

    const chats =
        JSON.parse(
            localStorage.getItem(
                "dinoChats"
            ) || "[]"
        );

    chatsList.innerHTML =
        "";

    if (chats.length === 0) {

        chatsList.innerText =
            "لا توجد محادثات محفوظة.";

        return;
    }

    chats.forEach(
        function(chat) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "sidebar-item";

            div.innerText =
                "💬 " +
                (
                    chat.messages[0] ||
                    "محادثة"
                ).slice(0, 70) +
                "\n" +
                chat.date;

            div.onclick =
                function() {

                    chatBox.innerHTML =
                        "";

                    chat.messages.forEach(
                        function(message) {

                        }

}

voiceCallButton.onclick =
    async function() {

        if (voiceCallActive) {
            return;
        }

        try {

            voiceStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            voiceCallActive =
                true;

            voiceCallPanel.classList.add(
                "active"
            );

            voiceStatus.innerText =
                "🎤 جاهز أسمعك";

            voiceTranscript.innerText =
                "";

            startVoiceRecording();

        } catch (error) {

            console.error(error);

            alert(
                "اسمح للمتصفح باستخدام الميكروفون."
            );

        }
    };


function startVoiceRecording() {

    if (!voiceCallActive) {
        return;
    }

    if (voiceProcessing) {
        return;
    }

    if (
        voiceRecorder &&
        voiceRecorder.state === "recording"
    ) {
        return;
    }

    if (!voiceStream) {
        return;
    }

    voiceChunks = [];

    try {

        voiceRecorder =
            new MediaRecorder(
                voiceStream
            );

    } catch (error) {

        voiceStatus.innerText =
            "⚠️ المتصفح لا يدعم تسجيل الصوت.";

        return;
    }

    voiceRecorder.ondataavailable =
        function(event) {

            if (event.data.size > 0) {

                voiceChunks.push(
                    event.data
                );

            }
        };


    voiceRecorder.onstart =
        function() {

            voiceMicButton.classList.add(
                "recording"
            );

            voiceStatus.innerText =
                "🔴 جاري الاستماع...";

        };


    voiceRecorder.onstop =
        async function() {

            voiceMicButton.classList.remove(
                "recording"
            );

            if (!voiceCallActive) {
                return;
            }

            voiceProcessing =
                true;

            voiceStatus.innerText =
                "⏳ Dino AI بيسمعك...";

            const blob =
                new Blob(
                    voiceChunks,
                    {
                        type:
                            "audio/webm"
                    }
                );

            if (blob.size === 0) {

                voiceProcessing =
                    false;

                if (voiceCallActive) {

                    setTimeout(
                        startVoiceRecording,
                        300
                    );

                }

                return;
            }

            selectedAudio =
                blob;

            await sendVoiceMessage();

        };


    voiceRecorder.onerror =
        function(error) {

            console.error(
                "Voice recorder error:",
                error
            );

            voiceProcessing =
                false;

            if (voiceCallActive) {

                voiceStatus.innerText =
                    "⚠️ حصلت مشكلة في تسجيل الصوت.";

                setTimeout(
                    startVoiceRecording,
                    1000
                );

            }
        };


    voiceRecorder.start();

}


voiceMicButton.onclick =
    function() {

        if (!voiceCallActive) {
            return;
        }

        if (voiceProcessing) {
            return;
        }

        if (
            voiceRecorder &&
            voiceRecorder.state === "recording"
        ) {

            voiceRecorder.stop();

            return;
        }

        startVoiceRecording();

    };


async function sendVoiceMessage() {

    try {

        const formData =
            new FormData();

        formData.append(
            "message",
            ""
        );

        formData.append(
            "audio",
            selectedAudio,
            "voice.webm"
        );

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!voiceCallActive) {
            return;
        }

        if (data.error) {

            voiceStatus.innerText =
                "⚠️ " + data.error;

            voiceProcessing =
                false;

            setTimeout(
                startVoiceRecording,
                1200
            );

            return;
        }

        if (data.transcript) {

            voiceTranscript.innerText =
                "أنت: " +
                data.transcript;

        }

        const reply =
            data.reply ||
            "لم يصل رد.";

        displayBotReply(
            reply
        );

        voiceTranscript.innerText =
            reply;

        if (data.audio) {

            voiceStatus.innerText =
                "🔊 Dino AI بيتكلم...";

            const audio =
                playAudio(
                    data.audio
                );

            if (audio) {

                audio.onended =
                    function() {

                        currentVoiceAudio =
                            null;

                        voiceProcessing =
                            false;

                        if (voiceCallActive) {

                            voiceStatus.innerText =
                                "🎤 جاهز أسمعك تاني";

                            setTimeout(
                                startVoiceRecording,
                                350
                            );

                        }
                    };

                audio.onerror =
                    function() {

                        currentVoiceAudio =
                            null;

                        voiceProcessing =
                            false;

                        if (voiceCallActive) {

                            voiceStatus.innerText =
                                "🎤 جاهز أسمعك تاني";

                            setTimeout(
                                startVoiceRecording,
                                350
                            );

                        }
                    };

            } else {

                voiceProcessing =
                    false;

                if (voiceCallActive) {

                    voiceStatus.innerText =
                        "🎤 جاهز أسمعك تاني";

                    setTimeout(
                        startVoiceRecording,
                        350
                    );
                }
            }

        } else {

            voiceStatus.innerText =
                "⚠️ وصل الرد كنص فقط — خدمة الصوت غير متاحة حالياً.";

            voiceProcessing =
                false;

            setTimeout(
                function() {

                    if (voiceCallActive) {

                        voiceStatus.innerText =
                            "🎤 جاهز أسمعك تاني";

                        startVoiceRecording();

                    }

                },
                1200
            );
        }

    } catch (error) {

        console.error(error);

        voiceStatus.innerText =
            "⚠️ حصل خطأ في الاتصال بـ Dino AI.";

        voiceProcessing =
            false;

        if (voiceCallActive) {

            setTimeout(
                startVoiceRecording,
                1500
            );
        }

    }

    selectedAudio =
        null;
}


endVoiceCallButton.onclick =
    function() {

        voiceCallActive =
            false;

        voiceProcessing =
            false;

        if (currentVoiceAudio) {

            try {

                currentVoiceAudio.pause();

                currentVoiceAudio.currentTime =
                    0;

            } catch (error) {

                console.log(error);

            }

            currentVoiceAudio =
                null;
        }

        if (
            voiceRecorder &&
            voiceRecorder.state === "recording"
        ) {

            try {

                voiceRecorder.stop();

            } catch (error) {

                console.log(error);

            }
        }

        if (voiceStream) {

            voiceStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            voiceStream =
                null;
        }

        voiceRecorder =
            null;

        voiceChunks =
            [];

        voiceCallPanel.classList.remove(
            "active"
        );

        voiceStatus.innerText =
            "اضغط على الميكروفون وابدأ الكلام";

        voiceTranscript.innerText =
            "";

    };
