<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino AI</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="app">

        <header class="top-bar">
            <div class="logo">
                Dino AI
            </div>
        </header>

            <div class="welcome">
                <div class="dino-icon">🦖</div>

                <p>

                </p>
            </div>

            <div class="message bot">
                أهلاً بك 👋 أنا Dino AI، كيف يمكنني مساعدتك؟

        <div class="input-wrapper">

            <div class="input-area">

                <input
                    type="text"
                    id="userInput"
                    placeholder="اكتب رسالتك..."
                    autocomplete="off"
                    spellcheck="false"

                <button id="sendButton" type="button">↑</button>

            </div>

            <div class="input-note">
                Dino AI يمكن أن يخطئ أحيانًا، تحقق من المعلومات المهمة.

        </div>
