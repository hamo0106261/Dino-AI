<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino AI 🦖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 600px;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      background: #111;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .user {
      background: #333;
    }

    .ai {
      background: #244d2b;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      background: #39b54a;
      color: white;
    }

    button:hover {
      background: #2d963b;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>🦖 Dino AI</h1>

    <div id="chat">
      <div class="message ai">
        أهلاً بك! أنا Dino AI 🦖
      </div>
    </div>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا...">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      chat.innerHTML += `
        <div class="message user">
          ${message}
        </div>
      `;

      input.value = "";

      const loading = document.createElement("div");
      loading.className = "message ai";
      loading.textContent = "Dino AI يفكر... 🦖";
      chat.appendChild(loading);

      try {
        const response = await fetch(
          "https://still-disk-8324.mmaojmmmoh.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        loading.textContent =
          data.reply || data.error || "حصل خطأ في الرد.";

      } catch (error) {
        loading.textContent = "حصل خطأ في الاتصال بـ Dino AI.";
      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
