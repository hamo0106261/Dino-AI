<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino AI 🦖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110a;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      margin: auto;
      background: #101a13;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: #0c1510;
      border-bottom: 1px solid #29402f;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .subtitle {
      color: #9db0a2;
      margin-top: 6px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      text-align: center;
      margin-top: 120px;
      color: #aebbb2;
    }

    .dino {
      font-size: 75px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      margin: 12px 0;
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #258b3e;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #202d24;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 18px;
      background: #0c1510;
      border-top: 1px solid #29402f;
    }

    #messageInput {
      flex: 1;
      padding: 15px;
      border: 1px solid #38513e;
      border-radius: 15px;
      background: #18251b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #39b653;
    }

    button {
      padding: 0 25px;
      border: none;
      border-radius: 15px;
      background: #31a849;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #26863a;
    }

    .copyright {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: #718276;
      background: #0c1510;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 12px;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🦖 Dino AI</div>
      <div class="subtitle">مساعدك الذكي</div>
    </div>

    <div id="chat">

      <div class="welcome">
        <div class="dino">🦖</div>
        <h2>أهلاً بك في Dino AI</h2>
        <p>اكتب رسالتك ودعنا نتحدث!</p>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك هنا..."
      >

      <button id="sendButton">إرسال</button>

    </div>

    <div class="copyright">
      © 2026 Mohamed Reda — All Rights Reserved.
    </div>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }

      const welcome = document.querySelector(".welcome");

      if (welcome) {
        welcome.remove();
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Dino AI يفكر... 🦖";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch(
          "https://still-disk-8324.mmaojmmmoh.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        if (data.reply) {
          aiMessage.textContent = data.reply;
        } else {
          aiMessage.textContent =
            data.error || "حدث خطأ في الرد.";
        }

      } catch (error) {

        aiMessage.textContent =
          "حدث خطأ في الاتصال بـ Dino AI.";

      }

      chat.scrollTop = chat.scrollHeight;
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
