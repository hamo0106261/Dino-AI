<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1f2937;
            padding: 18px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 12px;
            max-width: 75%;
        }

        .bot {
            background: #374151;
            margin-right: auto;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            padding: 12px;
            background: #1f2937;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        🦖 Dino AI
    </header>

    <div id="chat">
        <div class="message bot">
            أهلاً بك! أنا Dino AI 🤖🦖<br>
            اكتب لي أي سؤال.
        </div>
    </div>

    <div class="input-area">
        <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = message;

            chat.appendChild(userMessage);

            input.value = "";

            const botMessage = document.createElement("div");
            botMessage.className = "message bot";
            botMessage.textContent = "أنا لسه بتعلم 😄🦖";

            chat.appendChild(botMessage);

            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("messageInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
