<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dino AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- القائمة الجانبية -->
    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">
                Dino AI
            </div>

            <button
                id="closeSidebar"
                class="close-sidebar"
                type="button">
                ×
            </button>

        </div>

        <button
            id="newChatButton"
            class="sidebar-button"
            type="button">
            ＋ محادثة جديدة
        </button>

        <div class="sidebar-section">

            <button
                id="memoryButton"
                class="sidebar-item"
                type="button">
                🧠 الذاكرة
            </button>

            <button
                id="chatsButton"
                class="sidebar-item"
                type="button">
                💬 المحادثات
            </button>

            <button
                id="settingsButton"
                class="sidebar-item"
                type="button">
                ⚙️ الإعدادات
            </button>

        </div>

        <div class="sidebar-bottom">

            <div class="sidebar-info">
                Dino AI
            </div>

        </div>

    </aside>


    <!-- نافذة الذاكرة -->
    <div id="memoryPanel" class="memory-panel">

        <div class="memory-header">

            <h2>🧠 الذاكرة</h2>

            <button
                id="closeMemory"
                type="button">
                ×
            </button>

        </div>

        <div class="memory-content">

            <p>
                يمكنك إضافة معلومات تريد أن يتذكرها Dino AI
                على هذا الجهاز.
            </p>

            <div
                id="memoryList"
                class="memory-list">
            </div>

            <div class="memory-add">

                <input
                    id="memoryInput"
                    type="text"
                    placeholder="اكتب معلومة لحفظها..."
                    autocomplete="off">

                <button
                    id="saveMemoryButton"
                    type="button">
                    حفظ
                </button>

            </div>

        </div>

    </div>


    <!-- المنطقة الرئيسية -->
    <main class="main-area">

        <!-- الشريط العلوي -->
        <header class="top-bar">

            <button
                id="menuButton"
                class="menu-button"
                type="button"
                aria-label="فتح القائمة">
                ☰
            </button>

            <div class="logo">
                Dino AI
            </div>

        </header>


        <!-- المحادثة -->
        <main
            id="chatBox"
            class="chat-box">

            <div class="welcome">

                <h1>
                    مرحباً بك في Dino AI
                </h1>

                <p>
                    كيف يمكنني مساعدتك اليوم؟
                </p>

            </div>

            <div class="message bot">

                أهلاً بك 👋 أنا Dino AI،
                اكتب سؤالك وسأحاول مساعدتك.

            </div>

        </main>


        <!-- منطقة الكتابة -->
        <div class="input-wrapper">

            <div class="input-area">

                <!-- زر الملفات -->
                <button
                    id="attachButton"
                    class="attach-button"
                    type="button"
                    aria-label="إرفاق ملف">
                    ＋
                </button>

                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,audio/*"
                    hidden>

                <input
                    type="text"
                    id="userInput"
                    placeholder="اسأل Dino AI..."
                    autocomplete="off"
                    spellcheck="false">

                <button
                    id="sendButton"
                    type="button"
                    aria-label="إرسال">
                    ↑
                </button>

            </div>

            <div
                id="attachmentPreview"
                class="attachment-preview">
            </div>

            <div class="input-note">

                Dino AI يمكن أن يخطئ أحيانًا،
                تحقق من المعلومات المهمة.

            </div>

        </div>


        <footer>
            © 2026 Mohamed Reda — Dino AI
        </footer>

    </main>

</div>


<script>

const API_URL =
    "https://dino-ai-api.mmaojmmmoh.workers.dev";


/* =========================
   العناصر
   ========================= */

const sidebar =
    document.getElementById("sidebar");

const menuButton =
    document.getElementById("menuButton");

const closeSidebar =
    document.getElementById("closeSidebar");

const memoryButton =
    document.getElementById("memoryButton");

const memoryPanel =
    document.getElementById("memoryPanel");

const closeMemory =
    document.getElementById("closeMemory");

const newChatButton =
    document.getElementById("newChatButton");

const chatsButton =
    document.getElementById("chatsButton");

const settingsButton =
    document.getElementById("settingsButton");

const memoryInput =
    document.getElementById("memoryInput");

const saveMemoryButton =
    document.getElementById("saveMemoryButton");

const memoryList =
    document.getElementById("memoryList");

const chatBox =
    document.getElementById("chatBox");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const attachButton =
    document.getElementById("attachButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");


/* =========================
   القائمة
   ========================= */

menuButton.addEventListener(
    "click",
    function () {

        sidebar.classList.add("open");

    }
);


closeSidebar.addEventListener(
    "click",
    function () {

        sidebar.classList.remove("open");

    }
);


/* =========================
   الذاكرة
   ========================= */

memoryButton.addEventListener(
    "click",
    function () {

        memoryPanel.classList.add("open");

        displayMemory();

    }
);


closeMemory.addEventListener(
    "click",
    function () {

        memoryPanel.classList.remove("open");

    }
);


/* =========================
   المحادثة الجديدة
   ========================= */

newChatButton.addEventListener(
    "click",
    function () {

        chatBox.innerHTML = `

            <div class="welcome">

                <h1>
                    مرحباً بك في Dino AI
                </h1>

                <p>
                    كيف يمكنني مساعدتك اليوم؟
                </p>

            </div>

            <div class="message bot">

                أهلاً بك 👋 أنا Dino AI،
                اكتب سؤالك وسأحاول مساعدتك.

            </div>

        `;

        sidebar.classList.remove("open");

        userInput.value = "";

        userInput.focus();

    }
);


/* =========================
   المحادثات
   ========================= */

chatsButton.addEventListener(
    "click",
    function () {

        alert(
            "قسم المحادثات سيتم إضافته قريبًا."
        );

    }
);


/* =========================
   الإعدادات
   ========================= */

settingsButton.addEventListener(
    "click",
    function () {

        alert(
            "قسم الإعدادات سيتم إضافته قريبًا."
        );

    }
);


/* =========================
   نظام الذاكرة
   ========================= */

function getMemory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "dinoMemory"
            ) || "[]"
        );

    } catch (error) {

        return [];

    }

}


function saveMemoryData(memory) {

    localStorage.setItem(
        "dinoMemory",
        JSON.stringify(memory)
    );

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function displayMemory() {

    if (!memoryList) return;

    const memory =
        getMemory();

    memoryList.innerHTML = "";

    if (memory.length === 0) {

        memoryList.innerHTML = `

            <div class="empty-memory">

                لا توجد معلومات محفوظة حتى الآن.

            </div>

        `;

        return;

    }


    memory.forEach(
        function (item, index) {

            const div =
                document.createElement("div");

            div.className =
                "memory-item";


            div.innerHTML = `

                <span>
                    ${escapeHtml(item)}
                </span>

                <button
                    type="button"
                    data-index="${index}">
                    ×
                </button>

            `;


            const deleteButton =
                div.querySelector("button");


            deleteButton.addEventListener(
                "click",
                function () {

                    const currentMemory =
                        getMemory();

                    currentMemory.splice(
                        index,
                        1
                    );

                    saveMemoryData(
                        currentMemory
                    );

                    displayMemory();

                }
            );


            memoryList.appendChild(div);

        }
    );

}


/* =========================
   إضافة ذاكرة
   ========================= */

saveMemoryButton.addEventListener(
    "click",
    function () {

        const text =
            memoryInput.value.trim();

        if (!text) return;


        const memory =
            getMemory();

        memory.push(text);


        saveMemoryData(
            memory
        );


        memoryInput.value = "";

        displayMemory();

    }
);


memoryInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            saveMemoryButton.click();

        }

    }
);


/* =========================
   الملفات
   ========================= */

let selectedFile = null;


attachButton.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];

        if (!file) return;

        selectedFile = file;

        attachmentPreview.innerHTML = `

            <div class="attachment-item">

                📎 ${escapeHtml(file.name)}

                <button
                    id="removeAttachment"
                    type="button">
                    ×
                </button>

            </div>

        `;


        document
            .getElementById(
                "removeAttachment"
            )
            .addEventListener(
                "click",
                function () {

                    selectedFile = null;

                    fileInput.value = "";

                    attachmentPreview.innerHTML = "";

                }
            );

    }
);


/* =========================
   عرض روابط الرد
   ========================= */

function displayBotReply(
    element,
    text
) {

    const urlRegex =
        /(https?:\/\/[^\s<>"']+)/g;

    const parts =
        text.split(urlRegex);


    parts.forEach(
        function (part) {

            if (
                /^https?:\/\//i.test(part)
            ) {

                const link =
                    document.createElement("a");

                link.href = part;

                link.textContent =
                    "🔗 فتح الرابط";

                link.target = "_blank";

                link.rel =
                    "noopener noreferrer";

                element.appendChild(link);

            } else {

                element.appendChild(
                    document.createTextNode(part)
                );

            }

        }
    );

}


/* =========================
   إرسال الرسالة
   ========================= */

async function sendMessage() {

    const message =
        userInput.value.trim();


    if (
        !message &&
        !selectedFile
    ) {

        return;

    }


    let messageToSend =
        message;


    if (selectedFile) {

        if (messageToSend) {

            messageToSend +=
                "\n\n📎 ملف مرفق: " +
                selectedFile.name;

        } else {

            messageToSend =
                "📎 ملف مرفق: " +
                selectedFile.name;

        }

    }


    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        messageToSend;

    chatBox.appendChild(
        userMessage
    );


    userInput.value = "";


    const fileWasSelected =
        selectedFile;


    selectedFile = null;

    fileInput.value = "";

    attachmentPreview.innerHTML = "";


    const botMessage =
        document.createElement("div");

    botMessage.className =
        "message bot";

    botMessage.textContent =
        "جاري التفكير...";

    chatBox.appendChild(
        botMessage
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message:
                            messageToSend
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            botMessage.textContent =
                "❌ خطأ: " +
                (
                    data.error ||
                    "حدث خطأ غير معروف"
                );

            return;

        }


        botMessage.textContent = "";


        displayBotReply(
            botMessage,
            data.reply ||
            "لم يصل رد من Dino AI."
        );


    } catch (error) {

        console.error(error);

        botMessage.textContent =
            "❌ حصل خطأ في الاتصال بـ Dino AI.";

    }


    chatBox.scrollTop =
        chatBox.scrollHeight;

    userInput.focus();

}


/* =========================
   زر الإرسال
   ========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* Enter للإرسال */

userInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* تشغيل الذاكرة */

displayMemory();

</script>

</body>

</html>
