<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dino AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           الرسائل
        ========================= */

        .message {
            max-width: 78%;
            padding: 13px 17px;
            margin: 10px 0;
            border-radius: 18px;
            line-height: 1.8;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            transition: 0.2s ease;
            white-space: pre-wrap;
        }

        .message.bot {
            margin-right: auto;
            margin-left: 0;
            background: transparent !important;
            color: #202124;
            border: none !important;
            border-radius: 0;
            padding: 8px 0;
            box-shadow: none !important;
        }

        .message.user {
            margin-left: auto;
            margin-right: 0;
            background: #2563eb;
            color: white;
            border: 1px solid #2563eb;
            border-radius: 18px;
            padding: 13px 17px;
            border-bottom-left-radius: 6px;
        }

        .message.bot a {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            border-radius: 10px;
            background: #e8eefc;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        body.dark-mode .message.bot {
            background: transparent !important;
            color: #f5f7fa !important;
            border: none !important;
            box-shadow: none !important;
        }

        body.dark-mode .message.user {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }

        body.dark-mode .message.bot a {
            background: #18263d;
            color: #70a7ff;
        }

        /* =========================
           أزرار الصوت
        ========================= */

        #voiceCallButton,
        #audioButton,
        #attachButton {
            cursor: pointer;
        }

        #voiceCallButton {
            border: none;
            background: transparent;
            font-size: 21px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: 0.2s;
        }

        #voiceCallButton:hover {
            background: rgba(37, 99, 235, 0.1);
        }

        #voiceCallButton.active {
            background: #ef4444;
            color: white;
            animation: voicePulse 1.2s infinite;
        }

        @keyframes voicePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* =========================
           نافذة المكالمة
        ========================= */

        #voiceCallPanel {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
        }

        #voiceCallPanel.open {
            display: flex;
        }

        .voiceCallBox {
            width: min(420px, 90%);
            background: white;
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .voiceCallBox {
            background: #111827;
            color: white;
        }

        .dinoAvatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            background: #2563eb;
        }

        .voiceCallTitle {
            margin-top: 20px;
            font-size: 23px;
            font-weight: bold;
        }

        #voiceCallStatus {
            margin-top: 10px;
            color: #777;
        }

        body.dark-mode #voiceCallStatus {
            color: #aaa;
        }

        #endVoiceCall {
            margin-top: 30px;
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        /* =========================
           المعاينات
        ========================= */

        #imagePreview,
        #audioPreview {
            margin: 8px 0;
        }

        #imagePreview img {
            max-width: 180px;
            border-radius: 12px;
        }

        #audioButton.recording {
            background: #ef4444 !important;
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         القائمة الجانبية
    ========================= -->

    <aside id="sidebar">

        <button id="closeSidebar">✕</button>

        <h2>Dino AI</h2>

        <button id="newChatButton">
            ➕ محادثة جديدة
        </button>

        <button id="memoryButton">
            🧠 الذاكرة
        </button>

        <button id="chatsButton">
            💬 المحادثات
        </button>

        <button id="settingsButton">
            ⚙️ الإعدادات
        </button>

    </aside>


    <!-- =========================
         الهيدر
    ========================= -->

    <header>

        <button id="menuButton">
            ☰
        </button>

        <h1>Dino AI</h1>

    </header>


    <!-- =========================
         المحتوى
    ========================= -->

    <main>

        <section id="chatBox">

            <div class="message bot">
                أهلاً بك 👋
                أنا Dino AI 🦖
                اسألني عن أي شيء.
            </div>

        </section>


        <div id="imagePreview"></div>

        <div id="audioPreview"></div>


        <!-- =========================
             شريط الكتابة
        ========================= -->

        <div id="inputArea">

            <!-- صورة -->

            <button id="attachButton" title="إرفاق صورة">

                <svg width="22"
                     height="22"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 1 1-2.83-2.83l8.49-8.48"/>

                </svg>

            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >


            <!-- زر المكالمة -->

            <button
                id="voiceCallButton"
                title="مكالمة صوتية"
            >
                📞
            </button>


            <!-- تسجيل صوت -->

            <button
                id="audioButton"
                title="تسجيل صوت"
            >

                <svg id="micIcon"
                     width="22"
                     height="22"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>

                </svg>

            </button>


            <!-- الكتابة -->

            <input
                type="text"
                id="userInput"
                placeholder="اكتب رسالتك..."
                autocomplete="off"
            >


            <button id="sendButton">
                إرسال
            </button>

        </div>

    </main>


    <!-- =========================
         نافذة المكالمة الصوتية
    ========================= -->

    <div id="voiceCallPanel">

        <div class="voiceCallBox">

            <div class="dinoAvatar">
                🦖
            </div>

            <div class="voiceCallTitle">
                Dino AI
            </div>

            <div id="voiceCallStatus">
                جاهز للمكالمة
            </div>

            <button id="endVoiceCall">
                📞
            </button>

        </div>

    </div>


    <!-- =========================
         الذاكرة
    ========================= -->

    <div id="memoryPanel" class="panel">

        <div class="panelHeader">

            <h2>🧠 الذاكرة</h2>

            <button id="closeMemory">
                ✕
            </button>

        </div>

        <input
            type="text"
            id="memoryInput"
            placeholder="اكتب شيئًا تريد أن يتذكره Dino..."
        >

        <button id="saveMemoryButton">
            حفظ
        </button>

        <div id="memoryList"></div>

    </div>


    <!-- =========================
         المحادثات
    ========================= -->

    <div id="chatsPanel" class="panel">

        <div class="panelHeader">

            <h2>💬 المحادثات</h2>

            <button id="closeChats">
                ✕
            </button>

        </div>

        <div id="chatsList"></div>

    </div>


    <!-- =========================
         الإعدادات
    ========================= -->

    <div id="settingsPanel" class="panel">

        <div class="panelHeader">

            <h2>⚙️ الإعدادات</h2>

            <button id="closeSettings">
                ✕
            </button>

        </div>

        <button id="darkModeButton">
            🌙 الوضع الداكن
        </button>

        <button id="clearMemoryButton">
            🗑️ حذف الذاكرة
        </button>

        <button id="clearChatsButton">
            🗑️ حذف المحادثات
        </button>

    </div>


    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        const API_URL =
            "https://dino-ai-api.mmaojmmmoh.workers.dev";


        /* العناصر */

        const sidebar =
            document.getElementById("sidebar");

        const menuButton =
            document.getElementById("menuButton");

        const closeSidebar =
            document.getElementById("closeSidebar");

        const newChatButton =
            document.getElementById("newChatButton");

        const memoryButton =
            document.getElementById("memoryButton");

        const chatsButton =
            document.getElementById("chatsButton");

        const settingsButton =
            document.getElementById("settingsButton");

        const memoryPanel =
            document.getElementById("memoryPanel");

        const chatsPanel =
            document.getElementById("chatsPanel");

        const settingsPanel =
            document.getElementById("settingsPanel");

        const closeMemory =
            document.getElementById("closeMemory");

        const closeChats =
            document.getElementById("closeChats");

        const closeSettings =
            document.getElementById("closeSettings");

        const memoryInput =
            document.getElementById("memoryInput");

        const saveMemoryButton =
            document.getElementById("saveMemoryButton");

        const memoryList =
            document.getElementById("memoryList");

        const chatsList =
            document.getElementById("chatsList");

        const chatBox =
            document.getElementById("chatBox");

        const userInput =
            document.getElementById("userInput");

        const sendButton =
            document.getElementById("sendButton");

        const attachButton =
            document.getElementById("attachButton");

        const imageInput =
            document.getElementById("imageInput");

        const imagePreview =
            document.getElementById("imagePreview");

        const audioButton =
            document.getElementById("audioButton");

        const audioPreview =
            document.getElementById("audioPreview");

        const voiceCallButton =
            document.getElementById("voiceCallButton");

        const voiceCallPanel =
            document.getElementById("voiceCallPanel");

        const voiceCallStatus =
            document.getElementById("voiceCallStatus");

        const endVoiceCall =
            document.getElementById("endVoiceCall");

        const darkModeButton =
            document.getElementById("darkModeButton");

        const clearMemoryButton =
            document.getElementById("clearMemoryButton");

        const clearChatsButton =
            document.getElementById("clearChatsButton");


        /* المتغيرات */

        let selectedImage = null;

        let selectedAudio = null;

        let mediaRecorder = null;

        let audioChunks = [];

        let microphoneStream = null;

        let isRecording = false;

        let voiceCallActive = false;


        /* القائمة */

        menuButton.onclick = () => {

            sidebar.classList.add("open");

        };


        closeSidebar.onclick = () => {

            sidebar.classList.remove("open");

        };


        /* اللوحات */

        function closeAllPanels() {

            memoryPanel.classList.remove("open");

            chatsPanel.classList.remove("open");

            settingsPanel.classList.remove("open");

        }


        memoryButton.onclick = () => {

            closeAllPanels();

            memoryPanel.classList.add("open");

            loadMemory();

        };


        chatsButton.onclick = () => {

            closeAllPanels();

            chatsPanel.classList.add("open");

            loadChats();

        };


        settingsButton.onclick = () => {

            closeAllPanels();

            settingsPanel.classList.add("open");

        };


        closeMemory.onclick = () => {

            memoryPanel.classList.remove("open");

        };


        closeChats.onclick = () => {

            chatsPanel.classList.remove("open");

        };


        closeSettings.onclick = () => {

            settingsPanel.classList.remove("open");

        };


        /* الرسائل */

        function addMessage(text, type) {

            const message =
                document.createElement("div");

            message.className =
                "message " + type;

            message.textContent =
                text;

            chatBox.appendChild(message);

            chatBox.scrollTop =
                chatBox.scrollHeight;

            return message;

        }


        function displayBotReply(text) {

            const message =
                document.createElement("div");

            message.className =
                "message bot";

            const urlRegex =
                /(https?:\/\/[^\s]+)/g;

            const parts =
                text.split(urlRegex);


            parts.forEach(part => {

                if (
                    part.startsWith("http://") ||
                    part.startsWith("https://")
                ) {

                    const link =
                        document.createElement("a");

                    link.href =
                        part;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                    link.textContent =
                        "🔗 فتح الرابط";

                    message.appendChild(link);

                } else {

                    message.appendChild(
                        document.createTextNode(part)
                    );

                }

            });


            chatBox.appendChild(message);

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /* إرسال */

        async function sendMessage() {

            const text =
                userInput.value.trim();


            if (
                text === "" &&
                !selectedAudio &&
                !selectedImage
            ) {

                return;

            }


            let messageText =
                text;


            if (selectedImage) {

                messageText +=
                    (messageText ? "\n" : "") +
                    "🖼️ صورة مرفقة: " +
                    selectedImage.name;

            }


            if (messageText) {

                addMessage(
                    messageText,
                    "user"
                );

            } else if (selectedAudio) {

                addMessage(
                    "🎤 رسالة صوتية",
                    "user"
                );

            }


            const formData =
                new FormData();


            formData.append(
                "message",
                text
            );


            if (selectedAudio) {

                formData.append(
                    "audio",
                    selectedAudio,
                    "dino-voice.webm"
                );

            }


            userInput.value = "";

            sendButton.disabled = true;


            const loading =
                addMessage(
                    "⌛ Dino AI يفكر...",
                    "bot"
                );


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                loading.remove();


                if (data.reply) {

                    displayBotReply(
                        data.reply
                    );

                } else if (data.error) {

                    displayBotReply(
                        "❌ " + data.error
                    );

                } else {

                    displayBotReply(
                        "❌ حصلت مشكلة في الرد."
                    );

                }

            } catch (error) {

                loading.remove();

                displayBotReply(
                    "❌ تعذر الاتصال بخدمة Dino AI."
                );

            }


            sendButton.disabled = false;

            selectedAudio = null;

            audioPreview.innerHTML = "";

            selectedImage = null;

            imagePreview.innerHTML = "";

        }


        sendButton.onclick =
            sendMessage;


        userInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );


        /* الصور */

        attachButton.onclick = () => {

            imageInput.click();

        };


        imageInput.onchange = event => {

            const file =
                event.target.files[0];

            if (!file) return;

            selectedImage = file;

            imagePreview.innerHTML = "";

            const image =
                document.createElement("img");

            image.src =
                URL.createObjectURL(file);

            imagePreview.appendChild(image);

        };


        /* تسجيل الصوت */

        audioButton.onclick =
            async () => {

                if (!isRecording) {

                    try {

                        microphoneStream =
                            await navigator.mediaDevices.getUserMedia({
                                audio: true
                            });


                        audioChunks = [];

                        mediaRecorder =
                            new MediaRecorder(
                                microphoneStream
                            );


                        mediaRecorder.ondataavailable =
                            event => {

                                if (
                                    event.data.size > 0
                                ) {

                                    audioChunks.push(
                                        event.data
                                    );

                                }

                            };


                        mediaRecorder.onstop =
                            () => {

                                const audioBlob =
                                    new Blob(
                                        audioChunks,
                                        {
                                            type:
                                                "audio/webm"
                                        }
                                    );


                                selectedAudio =
                                    audioBlob;


                                audioPreview.innerHTML =
                                    "";


                                const audio =
                                    document.createElement(
                                        "audio"
                                    );

                                audio.controls =
                                    true;

                                audio.src =
                                    URL.createObjectURL(
                                        audioBlob
                                    );


                                audioPreview.appendChild(
                                    audio
                                );


                                if (
                                    microphoneStream
                                ) {

                                    microphoneStream
                                        .getTracks()
                                        .forEach(
                                            track =>
                                                track.stop()
                                        );

                                }


                                sendMessage();

                            };


                        mediaRecorder.start();

                        isRecording = true;

                        audioButton.classList.add(
                            "recording"
                        );

                    } catch (error) {

                        alert(
                            "لا يمكن الوصول إلى الميكروفون."
                        );

                    }

                } else {

                    mediaRecorder.stop();

                    isRecording = false;

                    audioButton.classList.remove(
                        "recording"
                    );

                }

            };


        /* =========================
           زر المكالمة
        ========================= */

        voiceCallButton.onclick =
            async () => {

                if (voiceCallActive) {

                    endVoiceCallFunction();

                    return;

                }


                try {

                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });


                    voiceCallActive =
                        true;


                    voiceCallButton.classList.add(
                        "active"
                    );


                    voiceCallPanel.classList.add(
                        "open"
                    );


                    voiceCallStatus.textContent =
                        "🎤 المكالمة بدأت — تحدث مع Dino AI";


                } catch (error) {

                    alert(
                        "اسمح للمتصفح باستخدام الميكروفون أولاً."
                    );

                }

            };


        endVoiceCall.onclick =
            endVoiceCallFunction;


        function endVoiceCallFunction() {

            voiceCallActive =
                false;


            voiceCallButton.classList.remove(
                "active"
            );


            voiceCallPanel.classList.remove(
                "open"
            );


            voiceCallStatus.textContent =
                "جاهز للمكالمة";

        }


        /* =========================
           الذاكرة
        ========================= */

        function getMemory() {

            return JSON.parse(
                localStorage.getItem(
                    "dinoMemory"
                ) || "[]"
            );

        }


        function saveMemoryData(memory) {

            localStorage.setItem(
                "dinoMemory",
                JSON.stringify(memory)
            );

        }


        function loadMemory() {

            memoryList.innerHTML = "";

            const memory =
                getMemory();


            if (
                memory.length === 0
            ) {

                memoryList.textContent =
                    "لا توجد ذكريات محفوظة.";

                return;

            }


            memory.forEach(
                (item, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.textContent =
                        item;

                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.textContent =
                        "🗑️";

                    deleteButton.onclick =
                        () => {

                            const current =
                                getMemory();

                            current.splice(
                                index,
                                1
                            );

                            saveMemoryData(
                                current
                            );

                            loadMemory();

                        };

                    div.appendChild(
                        deleteButton
                    );

                    memoryList.appendChild(
                        div
                    );

                }
            );

        }


        saveMemoryButton.onclick =
            () => {

                const value =
                    memoryInput.value.trim();


                if (!value) return;


                const memory =
                    getMemory();


                memory.push(
                    value
                );


                saveMemoryData(
                    memory
                );


                memoryInput.value =
                    "";


                loadMemory();

            };


        /* =========================
           المحادثات
        ========================= */

        function saveCurrentChat() {

            const messages =
                Array.from(
                    chatBox.querySelectorAll(
                        ".message"
                    )
                );


            if (
                messages.length <= 1
            ) return;


            const chat =
                messages.map(
                    message =>
                        message.innerText
                );


            const chats =
                JSON.parse(
                    localStorage.getItem(
                        "dinoChats"
                    ) || "[]"
                );


            chats.push({
                date:
                    new Date().toLocaleString(
                        "ar-EG"
                    ),
                messages:
                    chat
            });


            localStorage.setItem(
                "dinoChats",
                JSON.stringify(chats)
            );

        }


        function loadChats() {

            chatsList.innerHTML =
                "";

            const chats =
                JSON.parse(
                    localStorage.getItem(
                        "dinoChats"
                    ) || "[]"
                );


            if (
                chats.length === 0
            ) {

                chatsList.textContent =
                    "لا توجد محادثات محفوظة.";

                return;

            }


            chats.reverse().forEach(
                chat => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "savedChat";


                    div.textContent =
                        "💬 " +
                        chat.date;


                    div.onclick =
                        () => {

                            chatBox.innerHTML =
                                "";


                            chat.messages.forEach(
                                message => {

                                    addMessage(
                                        message,
                                        "bot"
                                    );

                                }
                            );


                            chatsPanel.classList.remove(
                                "open"
                            );

                        };


                    chatsList.appendChild(
                        div
                    );

                }
            );

        }


        /* =========================
           محادثة جديدة
        ========================= */

        newChatButton.onclick =
            () => {

                saveCurrentChat();


                chatBox.innerHTML =
                    `
                    <div class="message bot">
                        أهلاً بك 👋
                        أنا Dino AI 🦖
                        اسألني عن أي شيء.
                    </div>
                    `;


                selectedImage =
                    null;

                selectedAudio =
                    null;

                imagePreview.innerHTML =
                    "";

                audioPreview.innerHTML =
                    "";

                imageInput.value =
                    "";

                sidebar.classList.remove(
                    "open"
                );

            };


        /* =========================
           الوضع الداكن
        ========================= */

        function applyDarkMode() {

            const enabled =
                localStorage.getItem(
                    "dinoDarkMode"
                ) === "true";


            document.body.classList.toggle(
                "dark-mode",
                enabled
            );

        }


        darkModeButton.onclick =
            () => {

                const enabled =
                    document.body.classList.contains(
                        "dark-mode"
                    );


                localStorage.setItem(
                    "dinoDarkMode",
                    String(!enabled)
                );


                applyDarkMode();

            };


        applyDarkMode();


        /* حذف الذاكرة */

        clearMemoryButton.onclick =
            () => {

                if (
                    confirm(
                        "هل تريد حذف كل الذاكرة؟"
                    )
                ) {

                    localStorage.removeItem(
                        "dinoMemory"
                    );

                    loadMemory();

                }

            };


        /* حذف المحادثات */

        clearChatsButton.onclick =
            () => {

                if (
                    confirm(
                        "هل تريد حذف كل المحادثات؟"
                    )
                ) {

                    localStorage.removeItem(
                        "dinoChats"
                    );

                    loadChats();

                }

            };

    </script>

</body>

</html>
