<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dino AI - مساعد الذكاء الاصطناعي</title>

  <meta
    name="description"
    content="Dino AI هو مساعد ذكاء اصطناعي ذكي وسريع يساعدك في الأسئلة والألعاب والمواضيع المختلفة."
  >

  <meta name="author" content="Mohamed Reda">
  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110a;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      margin: auto;
      background: #101a13;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: #0c1510;
      border-bottom: 1px solid #29402f;
      position: relative;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .subtitle {
      color: #9db0a2;
      margin-top: 6px;
    }

    .history-button {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 10px 14px;
      background: #202d24;
      border: 1px solid #38513e;
      border-radius: 12px;
      color: white;
      cursor: pointer;
    }

    .history-panel {
      display: none;
      position: absolute;
      top: 75px;
      right: 15px;
      width: 280px;
      max-height: 70vh;
      overflow-y: auto;
      background: #101a13;
      border: 1px solid #38513e;
      border-radius: 15px;
      padding: 15px;
      z-index: 100;
    }

    .history-panel.show {
      display: block;
    }

    .history-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #31a849;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .history-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #202d24;
      border-radius: 10px;
      cursor: pointer;
    }

    .history-text {
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-history {
      margin-top: 8px;
      padding: 6px 10px;
      background: #8b3030;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      text-align: center;
      margin-top: 120px;
      color: #aebbb2;
    }

    .dino {
      font-size: 75px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      margin: 12px 0;
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #258b3e;
      margin-left: auto;
    }

    .ai {
      background: #202d24;
      margin-right: auto;
    }

    .ai a {
      color: #6ee77d;
      text-decoration: underline;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 18px;
      background: #0c1510;
      border-top: 1px solid #29402f;
    }

    #messageInput {
      flex: 1;
      padding: 15px;
      border: 1px solid #38513e;
      border-radius: 15px;
      background: #18251b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 25px;
      border: none;
      border-radius: 15px;
      background: #31a849;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #26863a;
    }

    .copyright {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: #718276;
      background: #0c1510;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 12px;
      }

      button {
        padding: 0 16px;
      }

      .history-button {
        position: static;
        margin-bottom: 10px;
      }

      .history-panel {
        width: calc(100% - 30px);
        right: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <button
      class="history-button"
      id="historyButton"
      type="button">
      🗂️ الشاتات
    </button>

    <div class="logo">
      🦖 Dino AI
    </div>

    <div class="subtitle">
      مساعدك الذكي
    </div>

  </div>

  <div
    class="history-panel"
    id="historyPanel">

    <div class="history-title">
      🗂️ المحادثات القديمة
    </div>

    <button
      class="new-chat"
      id="newChatButton"
      type="button">
      ➕ محادثة جديدة
    </button>

    <div id="historyList"></div>

  </div>

  <div id="chat">

    <div class="welcome">

      <div class="dino">
        🦖
      </div>

      <h2>
        أهلاً بك في Dino AI
      </h2>

      <p>
        اكتب رسالتك ودعنا نتحدث!
      </p>

    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="اكتب رسالتك هنا..."
    >

    <button
      id="sendButton"
      type="button">
      إرسال
    </button>

  </div>

  <div class="copyright">
    © 2026 Mohamed Reda — All Rights Reserved.
  </div>

</div>

<script>

const WORKER_URL =
  "https://still-disk-8324.mmaojmmmoh.workers.dev/";

const input =
  document.getElementById("messageInput");

const button =
  document.getElementById("sendButton");

const chat =
  document.getElementById("chat");

const historyButton =
  document.getElementById("historyButton");

const historyPanel =
  document.getElementById("historyPanel");

const historyList =
  document.getElementById("historyList");

const newChatButton =
  document.getElementById("newChatButton");

let currentChatId =
  Date.now().toString();

let currentMessages = [];


function makeLinksClickable(text) {

  const escapedText =
    text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  return escapedText.replace(
    /(https?:\/\/[^\s<]+)/g,
    function(url) {

      return (
        '<a href="' +
        url +
        '" target="_blank" rel="noopener noreferrer">' +
        url +
        "</a>"
      );

    }
  );
}


function saveCurrentChat() {

  if (currentMessages.length === 0) {
    return;
  }

  const chats =
    JSON.parse(
      localStorage.getItem("dinoChats") || "[]"
    );

  const existingIndex =
    chats.findIndex(
      chatItem =>
        chatItem.id === currentChatId
    );

  const firstUserMessage =
    currentMessages.find(
      message =>
        message.role === "user"
    );

  const title =
    firstUserMessage
      ? firstUserMessage.text.substring(0, 35)
      : "محادثة جديدة";

  const chatData = {
    id: currentChatId,
    title: title,
    messages: currentMessages,
    date: new Date().toLocaleString("ar-EG")
  };

  if (existingIndex >= 0) {
    chats[existingIndex] = chatData;
  } else {
    chats.unshift(chatData);
  }

  localStorage.setItem(
    "dinoChats",
    JSON.stringify(chats)
  );

  loadHistory();
}


function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem("dinoChats") || "[]"
    );

  historyList.innerHTML = "";

  if (chats.length === 0) {

    historyList.innerHTML =
      "<p>مفيش محادثات محفوظة لسه.</p>";

    return;
  }

  chats.forEach(function(chatItem) {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    const text =
      document.createElement("div");

    text.className =
      "history-text";

    text.textContent =
      "💬 " + chatItem.title;

    item.appendChild(text);

    const date =
      document.createElement("small");

    date.textContent =
      chatItem.date;

    date.style.color =
      "#8ea095";

    item.appendChild(date);

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-history";

    deleteButton.type =
      "button";

    deleteButton.textContent =
      "🗑️ حذف";

    deleteButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const updatedChats =
          chats.filter(
            item =>
              item.id !== chatItem.id
          );

        localStorage.setItem(
          "dinoChats",
          JSON.stringify(updatedChats)
        );

        loadHistory();

      }
    );

    item.appendChild(deleteButton);

    item.addEventListener(
      "click",
      function() {
        openChat(chatItem);
      }
    );

    historyList.appendChild(item);

  });
}


function openChat(chatItem) {

  currentChatId =
    chatItem.id;

  currentMessages =
    chatItem.messages || [];

  chat.innerHTML = "";

  currentMessages.forEach(
    function(message) {

      const messageElement =
        document.createElement("div");

      messageElement.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "ai"
        );

      if (message.role === "user") {

        messageElement.textContent =
          message.text;

      } else {

        messageElement.innerHTML =
          makeLinksClickable(
            message.text
          );

      }

      chat.appendChild(
        messageElement
      );

    }
  );

  chat.scrollTop =
    chat.scrollHeight;

  historyPanel.classList.remove(
    "show"
  );
}


function startNewChat() {

  saveCurrentChat();

  currentChatId =
    Date.now().toString();

  currentMessages = [];

  chat.innerHTML = `
    <div class="welcome">
      <div class="dino">🦖</div>
      <h2>أهلاً بك في Dino AI</h2>
      <p>اكتب رسالتك ودعنا نتحدث!</p>
    </div>
  `;

  input.value = "";

  historyPanel.classList.remove(
    "show"
  );
}


async function sendMessage() {

  const message =
    input.value.trim();

  if (!message) {
    return;
  }

  const welcome =
    document.querySelector(".welcome");

  if (welcome) {
    welcome.remove();
  }

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  chat.appendChild(
    userMessage
  );

  currentMessages.push({
    role: "user",
    text: message
  });

  input.value = "";

  const aiMessage =
    document.createElement("div");

  aiMessage.className =
    "message ai";

  aiMessage.textContent =
    "Dino AI يفكر... 🦖";

  chat.appendChild(
    aiMessage
  );

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );

    const data =
      await response.json();

    const errorText =
      String(data.error || "")
        .toLowerCase();

    /*
      لا نعرض رسالة OpenAI الطويلة للمستخدم.
    */

    if (
      response.status === 429 ||
      errorText.includes("rate limit") ||
      errorText.includes("requests per day") ||
      errorText.includes("rpd")
    ) {

      aiMessage.textContent =
        "أنا موجود 🦖، لكن خدمة الذكاء الاصطناعي مش متاحة مؤقتًا. جرّب بعد شوية.";

      return;
    }

    if (data.reply) {

      aiMessage.innerHTML =
        makeLinksClickable(
          data.reply
        );

      currentMessages.push({
        role: "assistant",
        text: data.reply
      });

      saveCurrentChat();

    } else {

      aiMessage.textContent =
        "حصلت مشكلة مؤقتة في Dino AI 🦖. جرّب تاني.";

    }

  } catch (error) {

    aiMessage.textContent =
      "مش قادر أتصل بالخدمة دلوقتي 🦖. جرّب بعد شوية.";

    console.error(error);

  }

  chat.scrollTop =
    chat.scrollHeight;
}


historyButton.addEventListener(
  "click",
  function() {

    historyPanel.classList.toggle(
      "show"
    );

    loadHistory();

  }
);


newChatButton.addEventListener(
  "click",
  startNewChat
);


button.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }

  }
);


loadHistory();

</script>

</body>
</html>
