<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino AI 🦖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f0d;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 850px;
      height: 90vh;
      background: #121815;
      border: 1px solid #26352c;
      border-radius: 25px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #26352c;
      background: #101612;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #9aaa9f;
      margin-top: 5px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      margin: 12px 0;
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #2f8f46;
      margin-right: auto;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #202a24;
      margin-left: auto;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #26352c;
      display: flex;
      gap: 10px;
      background: #101612;
    }

    #messageInput {
      flex: 1;
      padding: 15px;
      border: 1px solid #34463a;
      border-radius: 15px;
      background: #19221d;
      color: white;
      outline: none;
      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #3caf57;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 0 22px;
      background: #36a94d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2d8e41;
    }

    .welcome {
      text-align: center;
      margin-top: 100px;
      color: #aebbb2;
    }

    .welcome .dino {
      font-size: 70px;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🦖 Dino AI</div>
      <div class="subtitle">مساعدك الذكي</div>
    </div>

    <div id="chat">

      <div class="welcome">
        <div class="dino">🦖</div>
        <h2>أهلاً بك في Dino AI</h2>
        <p>اكتب رسالتك ودعنا نتحدث!</p>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك هنا..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">إرسال</button>

    </div>

  </div>

  <script>
    async function sendMessage() {

      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      const welcome = document.querySelector(".welcome");

      if (welcome) {
        welcome.remove();
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Dino AI يفكر... 🦖";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch(
          "https://still-disk-8324.mmaojmmmoh.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        if (data.reply) {
          aiMessage.textContent = data.reply;
        } else {
          aiMessage.textContent =
            data.error || "حصل خطأ في الرد.";
        }

      } catch (error) {

        aiMessage.textContent =
          "حدث خطأ في الاتصال بـ Dino AI.";

      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
