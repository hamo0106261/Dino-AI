<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            overflow: hidden;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        /* =========================
           التطبيق
        ========================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           الشريط العلوي
        ========================= */

        .header {
            height: 60px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #eeeeee;
            background: #ffffff;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            background: #f2f2f2;
        }

        .icon-button svg {
            width: 21px;
            height: 21px;
        }

        /* =========================
           الشات
        ========================= */

        .chat-box {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           الترحيب
        ========================= */

        .welcome {
            width: 100%;
            max-width: 600px;
            margin: auto;
            text-align: center;
            padding: 30px;
        }

        .welcome h1 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 600;
            color: #202124;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.9;
        }

        /* =========================
           الرسائل
        ========================= */

        .message {
            max-width: 82%;
            margin: 10px 0;
            padding: 9px 0;
            line-height: 1.85;
            font-size: 15.5px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            margin-left: auto;
            margin-right: 0;
            padding: 11px 15px;
            background: #f1f1f1;
            color: #202124;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
        }

        .message.bot {
            margin-right: auto;
            margin-left: 0;
            padding: 8px 0;
            background: transparent !important;
            color: #202124;
            border: none !important;
            border-radius: 0;
            box-shadow: none !important;
        }

        .message.bot a {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            padding: 7px 11px;
            border-radius: 9px;
            background: #f1f5ff;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        /* =========================
           منطقة الإدخال
        ========================= */

        .input-area {
            width: 100%;
            padding: 8px 15px 16px;
            background: #ffffff;
        }

        .input-box {
            width: 100%;
            max-width: 900px;
            min-height: 56px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 28px;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .user-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #202124;
            padding: 10px 7px;
            font-size: 16px;
        }

        .user-input::placeholder {
            color: #8b8f94;
        }

        .small-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #555b61;
        }

        .small-button:hover {
            background: #f3f3f3;
        }

        .small-button svg {
            width: 21px;
            height: 21px;
        }

        .send-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #202124;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .send-button:hover {
            background: #000000;
        }

        .send-button:disabled {
            opacity: 0.45;
        }

        /* =========================
           تسجيل الصوت
        ========================= */

        .recording {
            background: #dc2626 !important;
            color: #ffffff !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.08);
            }
        }

        /* =========================
           معاينة المرفقات
        ========================= */

        .preview,
        .audio-preview {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 8px;
        }

        .preview img {
            max-width: 180px;
            max-height: 150px;
            border-radius: 12px;
        }

        .audio-preview audio {
            width: 100%;
        }

        /* =========================
           القائمة الجانبية
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 310px;
            height: 100vh;
            padding: 18px;
            background: #ffffff;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.12);
            z-index: 100;
            transition: right 0.25s ease;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 19px;
        }

        .sidebar-item {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 13px 15px;
            margin-bottom: 8px;
            background: #f5f5f5;
            color: #202124;
            text-align: right;
            font-size: 15px;
        }

        .sidebar-item:hover {
            background: #eaeaea;
        }

        /* =========================
           النوافذ
        ========================= */

        .panel {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
        }

        .panel.active {
            display: flex;
        }

        .panel-content {
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 22px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }

        /* =========================
           وضع المكالمة
        ========================= */

        .voice-call-panel {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #202124;
        }

        .voice-call-panel.active {
            display: flex;
        }

        .voice-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .voice-title {
            font-size: 25px;
            font-weight: 600;
        }

        .voice-status {
            margin-top: 10px;
            color: #6b7280;
            text-align: center;
        }

        .voice-controls {
            display: flex;
            gap: 18px;
            margin-top: 40px;
        }

        .voice-control {
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .voice-mic {
            background: #202124;
            color: #ffffff;
        }

        .voice-end {
            background: #eeeeee;
            color: #202124;
        }

        .voice-transcript {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            color: #6b7280;
            line-height: 1.8;
        }

        /* =========================
           الوضع الداكن
        ========================= */

        body.dark-mode {
            background: #0b1118;
            color: #f5f7fa;
        }

        body.dark-mode .header {
            background: #101720;
            border-color: #26313e;
        }

        body.dark-mode .header-title {
            color: #f5f7fa;

        body.dark-mode .icon-button {
            color: #f5f7fa;
        }

        body.dark-mode .icon-button:hover,

        }

        body.dark-mode .welcome h1 {
            color: #f5f7fa;
        }

        body.dark-mode .welcome p {
            color: #9ca3af;
        }

        body.dark-mode .message.bot {
            background: transparent !important;
            color: #f5f7fa !important;
        }

        body.dark-mode .message.user {
            background: #202a35;
            color: #f5f7fa;
        }

        body.dark-mode .message.bot a {
            background: #182538;
            color: #78a9ff;
        }

        body.dark-mode .input-area {
            background: #101720;
        }

        body.dark-mode .input-box {
            background: #151e28;
            border-color: #33404d;
        }

        body.dark-mode .user-input {
            color: #f5f7fa;
        }

        body.dark-mode .small-button {
            color: #d1d5db;
        }

        body.dark-mode .send-button {
            background: #f5f7fa;
            color: #111827;
        }

        body.dark-mode .sidebar {
            background: #101720;
            color: white;
        }

        body.dark-mode .sidebar-item {
            background: #1b2632;
            color: white;
        }

        body.dark-mode .panel-content {
            background: #111a23;
            color: white;
        }

        body.dark-mode textarea {
            background: #151e28;
            color: white;
            border-color: #33404d;
        }

        body.dark-mode .voice-call-panel {
            background: #0b1118;
            color: white;
        }

        body.dark-mode .voice-avatar {
            background: #18222d;
        }

        body.dark-mode .voice-status,
        body.dark-mode .voice-transcript {
            color: #9ca3af;
        }

        body.dark-mode .voice-mic {
            background: #f5f7fa;
            color: #111827;
        }

        body.dark-mode .voice-end {
            background: #202b37;
            color: white;
        }

        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 600px) {
            .header {
                height: 58px;
                min-height: 58px;
                padding: 0 10px;
            }

            .header-title {
                font-size: 19px;
            }

            .chat-box {
                padding: 20px 14px;
            }

            .welcome {
                padding: 20px 10px;
            }

            .welcome h1 {
                font-size: 26px;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                padding: 8px 8px 12px;
            }

            .input-box {
                min-height: 52px;
            }

            .user-input {
                font-size: 15px;
            }

            .sidebar {
                width: 285px;
            }
        }
    </style>
</head>

    /* =========================
       Add Message
    ========================= */

    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        message.innerText =
            text;

        chatBox.appendChild(message);

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return message;
    }


    /* =========================
       Bot Reply
    ========================= */

    function displayBotReply(text) {

        const message =
            document.createElement("div");

        message.className =
            "message bot";

        const urlRegex =
            /(https?:\/\/[^\s]+)/g;

        const parts =
            text.split(urlRegex);

        for (
            let i = 0;
            i < parts.length;
            i++
        ) {

            const part = parts[i];

            if (
                /^https?:\/\//.test(part)
            ) {

                const link =
                    document.createElement("a");

                link.href =
                    part;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.innerText =
                    "🔗 فتح الرابط";

                message.appendChild(link);

            } else {

                if (part) {

                    message.appendChild(
                        document.createTextNode(part)
                    );

                }

            }

        }

        chatBox.appendChild(message);

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return message;
    }


    /* =========================

    function playAudio(base64) {

        try {

            const audio =
                new Audio(
                    "data:audio/mpeg;base64," +
                    base64
                );

            audio.play().catch(() => {});

            return audio;

        } catch (error) {

            console.error(error);

            return null;

        }

    }


    /* =========================
       إرسال الرسالة
    ========================= */

    async function sendMessage() {

        let message =
            userInput.value.trim();

        if (
            !message &&
            !selectedAudio
        ) {
            return;
        }

        if (selectedImage) {

            message +=
                (
                    message
                        ? "\n\n"
                        : ""
                ) +
                "🖼️ صورة مرفقة: " +
                selectedImage.name;

        }

        if (message) {

            addMessage(
                message,
                "user"
            );

        }

        userInput.value = "";

        sendButton.disabled = true;

        const loading =
            addMessage(
                "Dino AI يكتب...",
                "bot"
            );

        try {

            let response;

            if (selectedAudio) {

                const formData =
                    new FormData();

                formData.append(
                    "message",
                    message
                );

                formData.append(
                    "audio",
                    selectedAudio,
                    "voice.webm"
                );

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );

            } else {

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        message
                                })
                        }
                    );

            }

            const data =
                await response.json();

            loading.remove();

            if (data.error) {

                displayBotReply(
                    "⚠️ " + data.error
                );

            } else {

                const reply =
                    data.reply ||
                    "لم يصل رد.";

                displayBotReply(reply);

                if (data.audio) {

                    playAudio(
                        data.audio
                    );

                }

            }

        } catch (error) {

            loading.remove();

            displayBotReply(
                "⚠️ حصل خطأ في الاتصال بـ Dino AI."
            );

        }

        selectedAudio = null;

        selectedImage = null;

        imagePreview.innerHTML = "";

        imagePreview.style.display =
            "none";

        audioPreview.innerHTML = "";

        audioPreview.style.display =
            "none";

        sendButton.disabled = false;
    }


    /* =========================
       الميكروفون العادي
    ========================= */

    audioButton.onclick =
        async function () {

            if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {

                mediaRecorder.stop();

                return;

            }

            try {

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                audioChunks = [];

                mediaRecorder =
                    new MediaRecorder(
                        microphoneStream
                    );

                mediaRecorder.ondataavailable =
                    function(event) {

                        if (
                            event.data.size > 0
                        ) {

                            audioChunks.push(
                                event.data
                            );

                        }

                    };

                mediaRecorder.onstop =
                    function() {

                        const blob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        "audio/webm"
                                }
                            );

                        selectedAudio = blob;

                        const url =
                            URL.createObjectURL(
                                blob
                            );

                        audioPreview.innerHTML =
                            `
                            <audio controls src="${url}"></audio>
                            `;

                        audioPreview.style.display =
                            "block";

                        if (
                            microphoneStream
                        ) {

                            microphoneStream
                                .getTracks()
                                .forEach(
                                    track =>
                                        track.stop()
                                );

                        }

                        audioButton.classList.remove(
                            "recording"
                        );

                        sendMessage();

                    };

                mediaRecorder.start();

                audioButton.classList.add(
                    "recording"
                );

            } catch (error) {

                alert(
                    "اسمح للمتصفح باستخدام الميكروفون."
                );

            }

        };


    /* =========================
       المرفقات
    ========================= */

    attachButton.onclick =
        function() {

            imageInput.click();

        };

    imageInput.onchange =
        function() {

            const file =
                imageInput.files[0];

            if (!file) {
                return;
            }

            selectedImage = file;

            const url =
                URL.createObjectURL(file);

            imagePreview.innerHTML =
                `<img src="${url}">`;

            imagePreview.style.display =
                "block";

        };


    /* =========================
       إرسال
    ========================= */

    sendButton.onclick =
        function() {

            sendMessage();

        };

    userInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================
       القائمة
    ========================= */

    menuButton.onclick =
        function() {

            sidebar.classList.add(
                "open"
            );

        };

    closeSidebar.onclick =
        function() {

            sidebar.classList.remove(
                "open"
            );

        };


    /* =========================
       محادثة جديدة
    ========================= */

    newChatButton.onclick =
        function() {

            saveCurrentChat();

            chatBox.innerHTML =
                `
                <div class="welcome">

                    <h1>Dino AI</h1>

                    <p>
                        أهلاً بك 👋
                        <br>
                        أنا Dino AI، اسألني عن أي شيء.
                    </p>

                </div>
                `;

            sidebar.classList.remove(
                "open"
            );

        };


    /* =========================
       الذاكرة
    ========================= */

    function getMemory() {

        return JSON.parse(
            localStorage.getItem(
                "dinoMemory"
            ) || "[]"
        );

    }

    function renderMemory() {

        const memory =
            getMemory();

        memoryList.innerHTML = "";

        if (
            memory.length === 0
        ) {

            memoryList.innerText =
                "لا توجد ذكريات محفوظة.";

            return;

        }

        memory.forEach(
            function(item, index) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "sidebar-item";

                div.innerText =
                    item;

                div.onclick =
                    function() {

                        memory.splice(
                            index,
                            1
                        );

                        localStorage.setItem(
                            "dinoMemory",
                            JSON.stringify(memory)
                        );

                        renderMemory();

                    };

                memoryList.appendChild(
                    div
                );

            }
        );

    }

    memoryButton.onclick =
        function() {

            renderMemory();

            memoryPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };

    closeMemory.onclick =
        function() {

            memoryPanel.classList.remove(
                "active"
            );

        };

    saveMemoryButton.onclick =
        function() {

            const text =
                memoryInput.value.trim();

            if (!text) {
                return;
            }

            const memory =
                getMemory();

            memory.push(text);

            localStorage.setItem(
                "dinoMemory",
                JSON.stringify(memory)
            );

            memoryInput.value = "";

            renderMemory();

        };


    /* =========================
       المحادثات
    ========================= */

    function saveCurrentChat() {

        const messages =
            Array.from(
                chatBox.querySelectorAll(
                    ".message"
                )
            );

        if (
            messages.length === 0
        ) {
            return;
        }

        const chats =
            JSON.parse(
                localStorage.getItem(
                    "dinoChats"
                ) || "[]"
            );

        const content =
            messages.map(
                message =>
                    message.innerText
            );

        chats.unshift({
            date:
                new Date().toLocaleString(
                    "ar-EG"
                ),
            messages:
                content
        });

        localStorage.setItem(
            "dinoChats",
            JSON.stringify(
                chats.slice(0, 20)
            )
        );

    }

    function renderChats() {

        const chats =
            JSON.parse(
                localStorage.getItem(
                    "dinoChats"
                ) || "[]"
            );

        chatsList.innerHTML = "";

        if (
            chats.length === 0
        ) {

            chatsList.innerText =
                "لا توجد محادثات محفوظة.";

            return;

        }

        chats.forEach(
            function(chat) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "sidebar-item";

                div.innerText =
                    "💬 " +
                    (
                        chat.messages[0] ||
                        "محادثة"
                    ).slice(0, 70) +
                    "\n" +
                    chat.date;

                div.onclick =
                    function() {

                        chatBox.innerHTML =
                            "";

                        chat.messages.forEach(
                            function(message) {

                                displayBotReply(
                                    message
                                );

                            }
                        );

                        chatsPanel.classList.remove(
                            "active"
                        );

                    };

                chatsList.appendChild(
                    div
                );

            }
        );

    }

    chatsButton.onclick =
        function() {

            renderChats();

            chatsPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };

    closeChats.onclick =
        function() {

            chatsPanel.classList.remove(
                "active"
            );

        };


    /* =========================
       الإعدادات
    ========================= */

    settingsButton.onclick =
        function() {

            settingsPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };

    closeSettings.onclick =
        function() {

            settingsPanel.classList.remove(
                "active"
            );

        };

    darkModeButton.onclick =
        function() {

            document.body.classList.toggle(
                "dark-mode"
            );

            localStorage.setItem(
                "dinoDarkMode",
                document.body.classList.contains(
                    "dark-mode"
                )
            );

        };

    deleteMemoryButton.onclick =
        function() {

            localStorage.removeItem(
                "dinoMemory"
            );

            renderMemory();

        };

    deleteChatsButton.onclick =
        function() {

            localStorage.removeItem(
                "dinoChats"
            );

            renderChats();

        };


    /* =========================
       الوضع الداكن
    ========================= */

    if (
        localStorage.getItem(
            "dinoDarkMode"
        ) === "true"
    ) {

        document.body.classList.add(
            "dark-mode"
        );

    }


    /* =========================
       Voice Call
    ========================= */

    voiceCallButton.onclick =
        async function() {

            try {

                voiceStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                voiceCallActive = true;

                voiceCallPanel.classList.add(
                    "active"
                );

                voiceStatus.innerText =
                    "اضغط على الميكروفون وابدأ الكلام";

                voiceTranscript.innerText =
                    "";

            } catch (error) {

                alert(
                    "اسمح للمتصفح باستخدام الميكروفون."
                );

            }

        };


    /* =========================
       Voice Recording
    ========================= */

    voiceMicButton.onclick =
        function() {

            if (!voiceCallActive) {
                return;
            }

            if (
                voiceRecorder &&
                voiceRecorder.state ===
                "recording"
            ) {

                voiceRecorder.stop();

                return;

            }

            voiceChunks = [];

            if (!voiceStream) {

                navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    })
                    .then(
                        function(stream) {

                            voiceStream =
                                stream;

                            startVoiceRecording();

                        }
                    )
                    .catch(
                        function() {

                            voiceStatus.innerText =
                                "لم أستطع الوصول للميكروفون.";

                        }
                    );

            } else {

                startVoiceRecording();

            }

        };


    function startVoiceRecording() {

        voiceRecorder =
            new MediaRecorder(
                voiceStream
            );

        voiceRecorder.ondataavailable =
            function(event) {

                if (
                    event.data.size > 0
                ) {

                    voiceChunks.push(
                        event.data
                    );

                }

            };

        voiceRecorder.onstart =
            function() {

                voiceMicButton.classList.add(
                    "recording"
                );

                voiceStatus.innerText =
                    "🔴 جاري الاستماع... اضغط مرة أخرى للإرسال";

            };

        voiceRecorder.onstop =
            async function() {

                voiceMicButton.classList.remove(
                    "recording"
                );

                voiceStatus.innerText =
                    "⏳ Dino AI بيسمعك...";

                const blob =
                    new Blob(
                        voiceChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                selectedAudio =
                    blob;

                await sendVoiceMessage();

            };

        voiceRecorder.start();

    }


    /* =========================
       إرسال الصوت
    ========================= */

    async function sendVoiceMessage() {

        try {

            const formData =
                new FormData();

            formData.append(
                "message",
                ""
            );

            formData.append(
                "audio",
                selectedAudio,
                "voice.webm"
            );

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (data.error) {

                voiceStatus.innerText =
                    "⚠️ " + data.error;

                return;

            }

            const reply =
                data.reply ||
                "لم يصل رد.";

            displayBotReply(reply);

            voiceTranscript.innerText =
                reply;

            if (data.audio) {

                voiceStatus.innerText =
                    "🔊 Dino AI بيرد عليك...";

                const audio =
                    playAudio(
                        data.audio
                    );

                if (audio) {

                    audio.onended =
                        function() {

                            if (
                                voiceCallActive
                            ) {

                                voiceStatus.innerText =
                                    "🎤 جاهز أسمعك تاني";

                            }

                        };

                }

            } else {

                voiceStatus.innerText =
                    "🎤 جاهز أسمعك تاني";

            }

        } catch (error) {

            voiceStatus.innerText =
                "⚠️ حصل خطأ في الاتصال بـ Dino AI.";

        }

        selectedAudio = null;

    }


    /* =========================
       إنهاء المكالمة
    ========================= */

    endVoiceCallButton.onclick =
        function() {

            voiceCallActive = false;

            if (
                voiceRecorder &&
                voiceRecorder.state ===
                "recording"
            ) {

                voiceRecorder.stop();

            }

            if (voiceStream) {

                voiceStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                voiceStream = null;

            }

            voiceCallPanel.classList.remove(
                "active"
            );

            voiceStatus.innerText =
                "اضغط على الميكروفون وابدأ الكلام";

            voiceTranscript.innerText =
                "";

        };

</script>

</body>
</html>
