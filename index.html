<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dino AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111827;
            height: 100vh;
            overflow: hidden;
        }

        body.dark-mode {
            background: #0b1118;
            color: #f5f7fa;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           Header
        ========================= */

        .header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
            z-index: 5;
        }

        body.dark-mode .header {
            background: #101720;
            border-color: #25303b;
        }

        .header-title {
            font-size: 21px;
            font-weight: bold;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: transparent;
            font-size: 21px;
        }

        .icon-button:hover {
            background: #f1f5f9;
        }

        body.dark-mode .icon-button:hover {
            background: #1b2632;
        }

        /* =========================
           Chat
        ========================= */

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .welcome {
            text-align: center;
            margin: auto;
            max-width: 600px;
        }

        .dino {
            font-size: 65px;
            margin-bottom: 10px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .welcome p {
            color: #6b7280;
            line-height: 1.8;
        }

        body.dark-mode .welcome p {
            color: #9ca3af;
        }

        .message {
            max-width: 78%;
            padding: 13px 17px;
            margin: 10px 0;
            border-radius: 18px;
            line-height: 1.8;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            margin-left: auto;
            margin-right: 0;
            background: #2563eb;
            color: white;
            border-bottom-left-radius: 6px;
        }

        .message.bot {
            margin-right: auto;
            margin-left: 0;
            background: transparent !important;
            color: #202124;
            border: none !important;
            border-radius: 0;
            padding: 8px 0;
            box-shadow: none !important;
        }

        body.dark-mode .message.bot {
            background: transparent !important;
            color: #f5f7fa !important;
        }

        .message.bot a {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            border-radius: 10px;
            background: #e8eefc;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        body.dark-mode .message.bot a {
            background: #182538;
            color: #78a9ff;
        }

        /* =========================
           Input
        ========================= */

        .input-area {
            padding: 12px 15px 16px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
        }

        body.dark-mode .input-area {
            background: #101720;
            border-color: #25303b;
        }

        .input-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            padding: 6px 8px;
            background: #ffffff;
        }

        body.dark-mode .input-box {
            background: #151e28;
            border-color: #33404d;
        }

        .user-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px;
            font-size: 16px;
            color: inherit;
        }

        .small-button {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 50%;
            font-size: 20px;
        }

        .small-button:hover {
            background: #f1f5f9;
        }

        body.dark-mode .small-button:hover {
            background: #202b37;
        }

        .send-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            font-size: 19px;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        .recording {
            background: #dc2626 !important;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.08);
            }
        }

        /* =========================
           Sidebar
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            right: -310px;
            width: 310px;
            height: 100vh;
            background: #ffffff;
            z-index: 20;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.15);
            transition: 0.25s;
            padding: 20px;
        }

        .sidebar.open {
            right: 0;
        }

        body.dark-mode .sidebar {
            background: #101720;
            color: white;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sidebar-item {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            border-radius: 12px;
            background: #f3f4f6;
            text-align: right;
            font-size: 16px;
        }

        body.dark-mode .sidebar-item {
            background: #1b2632;
            color: white;
        }

        /* =========================
           Panels
        ========================= */

        .panel {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
        }

        .panel.active {
            display: flex;
        }

        .panel-content {
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 20px;
        }

        body.dark-mode .panel-content {
            background: #111a23;
            color: white;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px;
            font-family: inherit;
            background: transparent;
            color: inherit;
        }

        /* =========================
           Image preview
        ========================= */

        .preview {
            display: none;
            margin: 8px auto;
            max-width: 900px;
        }

        .preview img {
            max-width: 180px;
            max-height: 150px;
            border-radius: 12px;
        }

        .audio-preview {
            display: none;
            margin: 8px auto;
            max-width: 900px;
        }

        .audio-preview audio {
            width: 100%;
        }

        /* =========================
           Voice Call
        ========================= */

        .voice-call-panel {
            position: fixed;
            inset: 0;
            background: #0b1118;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .voice-call-panel.active {
            display: flex;
        }

        .voice-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #182536;
            font-size: 65px;
            margin-bottom: 25px;
            box-shadow: 0 0 0 10px rgba(37, 99, 235, 0.12);
        }

        .voice-title {
            font-size: 28px;
            font-weight: bold;
        }

        .voice-status {
            margin-top: 10px;
            color: #aeb9c6;
            min-height: 25px;
            text-align: center;
        }

        .voice-controls {
            margin-top: 45px;
            display: flex;
            gap: 20px;
        }

        .voice-control {
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 50%;
            font-size: 25px;
        }

        .voice-mic {
            background: #2563eb;
            color: white;
        }

        .voice-end {
            background: #dc2626;
            color: white;
        }

        .voice-transcript {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            color: #d1d5db;
            line-height: 1.7;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }

            .chat-box {
                padding: 15px;
            }

            .header-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <button
            id="menuButton"

            ☰
        </button>

        </div>

            <button
                id="voiceCallButton"

            </button>

    </header>


    <!-- Chat -->
    <main

        <button

<!-- Voice Call -->

    </div>

    <div class="voice-controls">

<script>

    /* =========================
       API
    ========================= */

    const API_URL =
        "https://dino-ai-api.mmaojmmmoh.workers.dev";


    /* =========================
       Elements
    ========================= */

    const chatBox =
        document.getElementById("chatBox");

    const userInput =
        document.getElementById("userInput");

    const sendButton =
        document.getElementById("sendButton");

    const audioButton =
        document.getElementById("audioButton");

    const attachButton =
        document.getElementById("attachButton");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreview =
        document.getElementById("imagePreview");

    const audioPreview =
        document.getElementById("audioPreview");

    const sidebar =
        document.getElementById("sidebar");

    const menuButton =
        document.getElementById("menuButton");

    const closeSidebar =
        document.getElementById("closeSidebar");

    const newChatButton =
        document.getElementById("newChatButton");

    const memoryButton =
        document.getElementById("memoryButton");

    const chatsButton =
        document.getElementById("chatsButton");

    const settingsButton =
        document.getElementById("settingsButton");

    const memoryPanel =
        document.getElementById("memoryPanel");

    const chatsPanel =
        document.getElementById("chatsPanel");

    const settingsPanel =
        document.getElementById("settingsPanel");

    const closeMemory =
        document.getElementById("closeMemory");

    const closeChats =
        document.getElementById("closeChats");

    const closeSettings =
        document.getElementById("closeSettings");

    const memoryInput =
        document.getElementById("memoryInput");

    const saveMemoryButton =
        document.getElementById("saveMemoryButton");

    const memoryList =
        document.getElementById("memoryList");

    const chatsList =
        document.getElementById("chatsList");

    const darkModeButton =
        document.getElementById("darkModeButton");

    const deleteMemoryButton =
        document.getElementById("deleteMemoryButton");

    const deleteChatsButton =
        document.getElementById("deleteChatsButton");


    /* =========================
       Voice Call
    ========================= */

    const voiceCallButton =
        document.getElementById(
            "voiceCallButton"
        );

    const voiceCallPanel =
        document.getElementById(
            "voiceCallPanel"
        );

    const voiceMicButton =
        document.getElementById(
            "voiceMicButton"
        );

    const endVoiceCallButton =
        document.getElementById(
            "endVoiceCallButton"
        );

    const voiceStatus =
        document.getElementById(
            "voiceStatus"
        );

    const voiceTranscript =
        document.getElementById(
            "voiceTranscript"
        );


    /* =========================
       State
    ========================= */

    let selectedImage = null;

    let mediaRecorder = null;

    let audioChunks = [];

    let selectedAudio = null;

    let microphoneStream = null;

    let voiceCallActive = false;

    let voiceCallRecording = false;


    /* =========================
       Add Message
    ========================= */

    function addMessage(
        text,
        type
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message " + type;

        message.innerText =
            text;

        chatBox.appendChild(
            message
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return message;
    }


    /* =========================
       Bot Reply
    ========================= */

    function displayBotReply(
        text
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message bot";

        const urlRegex =
            /(https?:\/\/[^\s]+)/g;

        const parts =
            text.split(urlRegex);

        for (
            let i = 0;
            i < parts.length;
            i++
        ) {

            const part =
                parts[i];

            if (
                /^https?:\/\//.test(
                    part
                )
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    part;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.innerText =
                    "🔗 فتح الرابط";

                message.appendChild(
                    link
                );

            } else {

                if (part) {

                    message.appendChild(
                        document.createTextNode(
                            part
                        )
                    );

                }
            }
        }

        chatBox.appendChild(
            message
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return message;
    }


    /* =========================
       Send Message
    ========================= */

    async function sendMessage(
        voiceMode = false
    ) {

        let message =
            userInput.value.trim();

        if (
            !message &&
            !selectedAudio
        ) {
            return;
        }

        if (
            selectedImage
        ) {

            message +=
                (
                    message
                        ? "\n\n"
                        : ""
                ) +
                "🖼️ صورة مرفقة: " +
                selectedImage.name;
        }


        /* User message */

        if (message) {

            addMessage(
                message,
                "user"
            );

        }


        /* Clear input */

        userInput.value = "";

        sendButton.disabled = true;


        /* Loading */

        const loading =
            addMessage(
                "Dino AI يكتب...",
                "bot"
            );


        try {

            let response;


            if (
                selectedAudio
            ) {

                const formData =
                    new FormData();

                formData.append(
                    "message",
                    message
                );

                formData.append(
                    "audio",
                    selectedAudio,
                    "voice.webm"
                );

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );

            } else {

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        message
                                })
                        }
                    );

            }


            const data =
                await response.json();


            loading.remove();


            if (
                data.error
            ) {

                displayBotReply(
                    "⚠️ " +
                    data.error
                );

            } else {

                const reply =
                    data.reply ||
                    "لم يصل رد.";

                displayBotReply(
                    reply
                );


                /* تشغيل صوت Dino */

                if (
                    data.audio
                ) {

                    playAudio(
                        data.audio
                    );

                }

            }


        } catch (error) {

            loading.remove();

            displayBotReply(
                "⚠️ حصل خطأ في الاتصال بـ Dino AI."
            );

        }


        selectedAudio =
            null;

        selectedImage =
            null;

        imagePreview.innerHTML =
            "";

        imagePreview.style.display =
            "none";

        audioPreview.innerHTML =
            "";

        audioPreview.style.display =
            "none";

        sendButton.disabled =
            false;

    }


    /* =========================
       Play AI Audio
    ========================= */

    function playAudio(
        base64
    ) {

        try {

            const audio =
                new Audio(
                    "data:audio/mpeg;base64," +
                    base64
                );

            audio.play().catch(
                () => {}
            );

            return audio;

        } catch (
            error
        ) {

            console.error(
                error
            );

        }

    }


    /* =========================
       Microphone Recording
    ========================= */

    audioButton.onclick =
        async function () {

            if (
                mediaRecorder &&
                mediaRecorder.state ===
                "recording"
            ) {

                mediaRecorder.stop();

                return;
            }


            try {

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                audioChunks = [];

                mediaRecorder =
                    new MediaRecorder(
                        microphoneStream
                    );


                mediaRecorder.ondataavailable =
                    function (
                        event
                    ) {

                        if (
                            event.data.size >
                            0
                        ) {

                            audioChunks.push(
                                event.data
                            );

                        }

                    };


                mediaRecorder.onstop =
                    function () {

                        const blob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        "audio/webm"
                                }
                            );

                        selectedAudio =
                            blob;


                        const url =
                            URL.createObjectURL(
                                blob
                            );


                        audioPreview.innerHTML =
                            `
                            <audio
                                controls
                                src="${url}">
                            </audio>
                            `;

                        audioPreview.style.display =
                            "block";


                        if (
                            microphoneStream
                        ) {

                            microphoneStream
                                .getTracks()
                                .forEach(
                                    track =>
                                        track.stop()
                                );

                        }


                        audioButton.classList
                            .remove(
                                "recording"
                            );


                        sendMessage();

                    };


                mediaRecorder.start();

                audioButton.classList.add(
                    "recording"
                );


            } catch (
                error
            ) {

                alert(
                    "لازم تسمح للمتصفح باستخدام الميكروفون."
                );

            }

        };


    /* =========================
       Image
    ========================= */

    attachButton.onclick =
        function () {

            imageInput.click();

        };


    imageInput.onchange =
        function () {

            const file =
                imageInput.files[0];

            if (!file) {
                return;
            }

            selectedImage =
                file;

            const url =
                URL.createObjectURL(
                    file
                );

            imagePreview.innerHTML =
                `
                <img src="${url}">
                `;

            imagePreview.style.display =
                "block";

        };


    /* =========================
       Send Button
    ========================= */

    sendButton.onclick =
        function () {

            sendMessage();

        };


    userInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================
       Sidebar
    ========================= */

    menuButton.onclick =
        function () {

            sidebar.classList.add(
                "open"
            );

        };


    closeSidebar.onclick =
        function () {

            sidebar.classList.remove(
                "open"
            );

        };


    /* =========================
       New Chat
    ========================= */

    newChatButton.onclick =
        function () {

            saveCurrentChat();

            chatBox.innerHTML =
                `
                <div
                    id="welcomeMessage"
                    class="welcome">

                    <div class="dino">
                        🦖
                    </div>

                    <h1>
                        أهلاً بك في Dino AI
                    </h1>

                    <p>
                        اسألني أي سؤال وسأحاول مساعدتك.
                    </p>

                </div>
                `;

            sidebar.classList.remove(
                "open"
            );

        };


    /* =========================
       Memory
    ========================= */

    function getMemory() {

        return JSON.parse(
            localStorage.getItem(
                "dinoMemory"
            ) || "[]"
        );

    }


    function renderMemory() {

        const memory =
            getMemory();

        memoryList.innerHTML =
            "";

        if (
            memory.length === 0
        ) {

            memoryList.innerText =
                "لا توجد ذكريات محفوظة.";

            return;
        }

        memory.forEach(
            function (
                item,
                index
            ) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "sidebar-item";

                div.innerText =
                    item;

                div.onclick =
                    function () {

                        memory.splice(
                            index,
                            1
                        );

                        localStorage.setItem(
                            "dinoMemory",
                            JSON.stringify(
                                memory
                            )
                        );

                        renderMemory();

                    };

                memoryList.appendChild(
                    div
                );

            }
        );

    }


    memoryButton.onclick =
        function () {

            renderMemory();

            memoryPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };


    closeMemory.onclick =
        function () {

            memoryPanel.classList.remove(
                "active"
            );

        };


    saveMemoryButton.onclick =
        function () {

            const text =
                memoryInput.value.trim();

            if (!text) {
                return;
            }

            const memory =
                getMemory();

            memory.push(text);

            localStorage.setItem(
                "dinoMemory",
                JSON.stringify(
                    memory
                )
            );

            memoryInput.value =
                "";

            renderMemory();

        };


    /* =========================
       Chats
    ========================= */

    function saveCurrentChat() {

        const messages =
            Array.from(
                chatBox.querySelectorAll(
                    ".message"
                )
            );

        if (
            messages.length === 0
        ) {
            return;
        }

        const chats =
            JSON.parse(
                localStorage.getItem(
                    "dinoChats"
                ) || "[]"
            );

        const content =
            messages.map(
                message =>
                    message.innerText
            );

        chats.unshift(
            {
                date:
                    new Date()
                        .toLocaleString(
                            "ar-EG"
                        ),

                messages:
                    content
            }
        );

        localStorage.setItem(
            "dinoChats",
            JSON.stringify(
                chats.slice(
                    0,
                    20
                )
            )
        );

    }


    function renderChats() {

        const chats =
            JSON.parse(
                localStorage.getItem(
                    "dinoChats"
                ) || "[]"
            );

        chatsList.innerHTML =
            "";

        if (
            chats.length === 0
        ) {

            chatsList.innerText =
                "لا توجد محادثات محفوظة.";

            return;

        }

        chats.forEach(
            function (
                chat,
                index
            ) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "sidebar-item";

                div.innerText =
                    "💬 " +
                    (
                        chat.messages[0] ||
                        "محادثة"
                    ).slice(
                        0,
                        70
                    ) +
                    "\n" +
                    chat.date;

                div.onclick =
                    function () {

                        chatBox.innerHTML =
                            "";

                        chat.messages.forEach(
                            function (
                                message
                            ) {

                                const type =
                                    message.startsWith(
                                        "⚠️"
                                    )
                                        ? "bot"
                                        : "user";

                                addMessage(
                                    message,
                                    type
                                );

                            }
                        );

                        chatsPanel.classList.remove(
                            "active"
                        );

                    };

                chatsList.appendChild(
                    div
                );

            }
        );

    }


    chatsButton.onclick =
        function () {

            renderChats();

            chatsPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };


    closeChats.onclick =
        function () {

            chatsPanel.classList.remove(
                "active"
            );

        };


    /* =========================
       Settings
    ========================= */

    settingsButton.onclick =
        function () {

            settingsPanel.classList.add(
                "active"
            );

            sidebar.classList.remove(
                "open"
            );

        };


    closeSettings.onclick =
        function () {

            settingsPanel.classList.remove(
                "active"
            );

        };


    darkModeButton.onclick =
        function () {

            document.body.classList.toggle(
                "dark-mode"
            );

            localStorage.setItem(
                "dinoDarkMode",
                document.body.classList.contains(
                    "dark-mode"
                )
            );

        };


    deleteMemoryButton.onclick =
        function () {

            localStorage.removeItem(
                "dinoMemory"
            );

            renderMemory();

        };


    deleteChatsButton.onclick =
        function () {

            localStorage.removeItem(
                "dinoChats"
            );

            renderChats();

        };


    /* =========================
       Load Dark Mode
    ========================= */

    if (
        localStorage.getItem(
            "dinoDarkMode"
        ) === "true"
    ) {

        document.body.classList.add(
            "dark-mode"
        );

    }


    /* ==================================================
       VOICE MODE
    ================================================== */

    let voiceRecorder = null;

    let voiceChunks = [];

    let voiceStream = null;


    voiceCallButton.onclick =
        async function () {

            try {

                voiceStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                voiceCallActive =
                    true;

                voiceCallPanel.classList.add(
                    "active"
                );

                voiceStatus.innerText =
                    "🎤 المكالمة بدأت — اضغط الميكروفون وتحدث";

                voiceTranscript.innerText =
                    "";

            } catch (
                error
            ) {

                alert(
                    "اسمح للمتصفح باستخدام الميكروفون أولاً."
                );

            }

        };


    /* =========================
       Voice Record
    ========================= */

    voiceMicButton.onclick =
        function () {

            if (
                !voiceCallActive
            ) {
                return;
            }

            if (
                voiceRecorder &&
                voiceRecorder.state ===
                "recording"
            ) {

                voiceRecorder.stop();

                return;

            }


            voiceChunks = [];


            if (
                !voiceStream
            ) {

                navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    })
                    .then(
                        stream => {

                            voiceStream =
                                stream;

                            startVoiceRecording();

                        }
                    )
                    .catch(
                        () => {

                            voiceStatus.innerText =
                                "لم أستطع الوصول إلى الميكروفون.";

                        }
                    );

            } else {

                startVoiceRecording();

            }

        };


    function startVoiceRecording() {

        voiceRecorder =
            new MediaRecorder(
                voiceStream
            );


        voiceRecorder.ondataavailable =
            function (
                event
            ) {

                if (
                    event.data.size > 0
                ) {

                    voiceChunks.push(
                        event.data
                    );

                }

            };


        voiceRecorder.onstop =
            async function () {

                voiceMicButton.innerText =
                    "🎤";

                voiceMicButton.classList.remove(
                    "recording"
                );

                voiceStatus.innerText =
                    "⏳ Dino AI بيسمعك...";


                const blob =
                    new Blob(
                        voiceChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );


                voiceTranscript.innerText =
                    "🎤 تم تسجيل صوتك...";


                selectedAudio =
                    blob;


                await sendVoiceMessage();

            };


        voiceRecorder.start();

        voiceRecorder.onstart =
            function () {

                voiceMicButton.innerText =
                    "⏹️";

                voiceMicButton.classList.add(
                    "recording"
                );

                voiceStatus.innerText =
                    "🔴 جاري الاستماع... اضغط مرة ثانية للإرسال";

            };

    }


    /* =========================
       Send Voice Message
    ========================= */

    async function sendVoiceMessage() {

        try {

            const formData =
                new FormData();

            formData.append(
                "message",
                ""
            );

            formData.append(
                "audio",
                selectedAudio,
                "voice.webm"
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (
                data.error
            ) {

                voiceStatus.innerText =
                    "⚠️ " +
                    data.error;

                return;

            }


            const reply =
                data.reply ||
                "لم يصل رد.";


            /* عرض النص داخل المحادثة */

            displayBotReply(
                reply
            );


            voiceTranscript.innerText =
                reply;


            /* تشغيل صوت Dino */

            if (
                data.audio
            ) {

                voiceStatus.innerText =
                    "🔊 Dino AI بيرد عليك...";

                const audio =
                    playAudio(
                        data.audio
                    );


                if (audio) {

                    audio.onended =
                        function () {

                            if (
                                voiceCallActive
                            ) {

                                voiceStatus.innerText =
                                    "🎤 جاهز أسمعك تاني";

                            }

                        };

                }

            } else {

                voiceStatus.innerText =
                    "🎤 جاهز أسمعك تاني";

            }


        } catch (
            error
        ) {

            voiceStatus.innerText =
                "⚠️ حصل خطأ في الاتصال بـ Dino AI.";

        }

        selectedAudio =
            null;

    }


    /* =========================
       End Voice Call
    ========================= */

    endVoiceCallButton.onclick =
        function () {

            voiceCallActive =
                false;


            if (
                voiceRecorder &&
                voiceRecorder.state ===
                "recording"
            ) {

                voiceRecorder.stop();

            }


            if (
                voiceStream
            ) {

                voiceStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                voiceStream =
                    null;

            }


            voiceCallPanel.classList.remove(
                "active"
            );


            voiceStatus.innerText =
                "اضغط على الميكروفون وابدأ الكلام";

            voiceTranscript.innerText =
                "";

        };

</script>

</body>
</html>
